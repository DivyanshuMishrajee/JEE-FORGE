                                    <button class="jfevent-filter-btn ${this.currentFilter === 'Exam' ? 'jfevent-active-filter' : ''}" onclick="JFEVENT_View.setFilter('Exam')">📝 ${JEEFORGE_t('exam') || 'Exam'}</button>
                                    <button class="jfevent-filter-btn ${this.currentFilter === 'Personal' ? 'jfevent-active-filter' : ''}" onclick="JFEVENT_View.setFilter('Personal')">👤 ${JEEFORGE_t('personal') || 'Personal'}</button>
                                    <button class="jfevent-filter-btn ${this.currentFilter === 'Important' ? 'jfevent-active-filter' : ''}" onclick="JFEVENT_View.setFilter('Important')">⭐ ${JEEFORGE_t('important') || 'Important'}</button>
                                </div>
                            </div>

                            ${filtered.length === 0 ? `
                                <div class="jfevent-empty">
                                    <div class="jfevent-empty-icon">📭</div>
                                    <p>${JEEFORGE_t('no_events') || 'No events found. Create your first event to get started!'}</p>
                                    <button class="btn-primary btn-sm" style="margin-top:8px;" onclick="JFEVENT_View.showCreateEvent()">➕ ${JEEFORGE_t('create')}</button>
                                </div>
                            ` : `
                                <div class="jfevent-event-grid">
                                    ${filtered.map(event => this.renderEventCard(event)).join('')}
                                </div>
                            `}

                            ${this.renderCalendar()}

                            ${this.renderPastEvents()}
                        </div>
                    `;

                view.innerHTML = html;

                setTimeout(() => {
                    document.querySelectorAll('.jfevent-event-card[data-event-id]').forEach(el => {
                        const id = el.dataset.eventId;
                        this.loadMediaPreviews(id, el);
                    });
                }, 100);
            },

            renderEventCard(event) {
                const status = JFEVENT_EventManager.getEventStatus(event);
                const statusLabels = {
                    'upcoming': '🟢 ' + JEEFORGE_t('status_upcoming'),
                    'today': '🟡 ' + JEEFORGE_t('today'),
                    'past': '🔵 ' + JEEFORGE_t('status_past'),
                    'completed': '✅ ' + JEEFORGE_t('status_completed'),
                    'cancelled': '🔴 ' + JEEFORGE_t('status_cancelled')
                };
                const statusClasses = {
                    'upcoming': 'jfevent-status-upcoming',
                    'today': 'jfevent-status-today',
                    'past': 'jfevent-status-upcoming',
                    'completed': 'jfevent-status-completed',
                    'cancelled': 'jfevent-status-cancelled'
                };
                const countdown = JFEVENT_EventManager.getCountdown(event);
                const cdStr = countdown.total > 0 ?
                    `${countdown.days}d ${countdown.hours}h ${countdown.minutes}m` :
                    (status === 'upcoming' || status === 'today' ? '🔔 Soon!' : '');

                const categoryIcons = {
                    'Study': '📚',
                    'Exam': '📝',
                    'Goal': '🎯',
                    'Personal': '👤',
                    'Event': '🎉',
                    'Important': '⭐',
                    'Custom': '🏷️'
                };
                const catIcon = categoryIcons[event.category] || '🏷️';

                return `
                        <div class="jfevent-event-card" data-event-id="${event.id}">
                            <div class="jfevent-event-name">${event.name}</div>
                            <div class="jfevent-event-meta">
                                <span>📅 ${new Date(event.date).toLocaleDateString()}</span>
                                <span>⏰ ${event.time || '—'}</span>
                                ${event.location ? `<span>📍 ${event.location}</span>` : ''}
                            </div>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;">
                                <span class="jfevent-event-category">${catIcon} ${event.category}</span>
                                <span class="jfevent-event-status ${statusClasses[status]}">${statusLabels[status]}</span>
                            </div>
                            ${countdown.total > 0 && status !== 'completed' && status !== 'cancelled' ? `
                                <div class="jfevent-countdown">⏳ ${cdStr} remaining</div>
                            ` : ''}
                            ${event.description ? `<div style="font-size:13px;color:var(--text-secondary);margin:4px 0;">${event.description}</div>` : ''}
                            <div class="jfevent-media-preview" id="jfevent-preview-${event.id}"></div>
                            <div class="jfevent-event-actions">
                                <button class="btn-outline btn-sm" onclick="JFEVENT_View.openEvent('${event.id}')">📖 ${JEEFORGE_t('open')}</button>
                                <button class="btn-outline btn-sm" onclick="JFEVENT_View.showEditEvent('${event.id}')">✏️ ${JEEFORGE_t('edit')}</button>
                                ${status !== 'completed' && status !== 'cancelled' ? `<button class="btn-outline btn-sm" onclick="JFEVENT_EventManager.markCompleted('${event.id}');JFEVENT_View.render();">✅ ${JEEFORGE_t('complete')}</button>` : ''}
                                ${status !== 'cancelled' && status !== 'completed' ? `<button class="btn-outline btn-sm" style="border-color:var(--danger);color:var(--danger);" onclick="JFEVENT_EventManager.markCancelled('${event.id}');JFEVENT_View.render();">❌ ${JEEFORGE_t('cancel')}</button>` : ''}
                                <button class="btn-danger btn-sm" onclick="JFEVENT_View.deleteEvent('${event.id}')">🗑️</button>
                            </div>
                        </div>
                    `;
            },

            async loadMediaPreviews(eventId, container) {
                try {
                    const media = await JFEVENT_Storage.getMediaByEvent(eventId);
                    const previewEl = container.querySelector('.jfevent-media-preview');
                    if (!previewEl) return;
                    if (media.length === 0) { previewEl.innerHTML = ''; return; }
                    previewEl.innerHTML = media.slice(0, 6).map(m => {
                        const isImage = m.type === 'photo' || m.mime?.startsWith('image/');
                        const isVideo = m.type === 'video' || m.mime?.startsWith('video/');
                        const isAudio = m.type === 'audio' || m.type === 'voice' || m.mime?.startsWith('audio/');
                        if (isImage) {
                            return `<img class="jfevent-media-thumb" src="${m.data}" alt="${m.name}" onclick="event.stopPropagation();JFEVENT_View.openEvent('${eventId}')">`;
                        } else if (isVideo) {
                            return `<div class="jfevent-media-icon" onclick="event.stopPropagation();JFEVENT_View.openEvent('${eventId}')">🎬</div>`;
                        } else if (isAudio) {
                            return `<div class="jfevent-media-icon" onclick="event.stopPropagation();JFEVENT_View.openEvent('${eventId}')">🎙️</div>`;
                        } else {
                            return `<div class="jfevent-media-icon" onclick="event.stopPropagation();JFEVENT_View.openEvent('${eventId}')">📄</div>`;
                        }
                    }).join('');
                    if (media.length > 6) {
                        previewEl.innerHTML += `<div class="jfevent-media-icon" onclick="JFEVENT_View.openEvent('${eventId}')">+${media.length - 6}</div>`;
                    }
                } catch (e) {}
            },

            renderCalendar() {
                const month = this.currentMonth;
                const year = this.currentYear;
                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                    'October', 'November', 'December'
                ];
                const dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

                const eventsByDate = {};
                const allEvents = JFEVENT_EventManager.getEvents();
                for (const e of allEvents) {
                    if (e.status === 'cancelled') continue;
                    if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
                    eventsByDate[e.date].push(e);
                }

                let daysHtml = '';
                let firstDayIdx = (firstDay === 0) ? 6 : firstDay - 1;
                for (let i = 0; i < firstDayIdx; i++) {
                    daysHtml += `<div class="jfevent-cal-day jfevent-cal-empty"></div>`;
                }
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                    const isToday = dateStr === todayStr;
                    const hasEvent = eventsByDate[dateStr] && eventsByDate[dateStr].length > 0;
                    const cls = isToday ? 'jfevent-cal-today' : (hasEvent ? 'jfevent-cal-has-event' : '');
                    daysHtml += `
                            <div class="jfevent-cal-day ${cls}" onclick="JFEVENT_View.goToDate('${dateStr}')">
                                ${d}
                                ${hasEvent ? `<div class="jfevent-cal-dot"></div>` : ''}
                            </div>
                        `;
                }

                return `
                        <div class="jfevent-calendar-wrap">
                            <div class="jfevent-cal-header">
                                <h3>${monthNames[month]} ${year}</h3>
                                <div class="jfevent-cal-nav">
                                    <button onclick="JFEVENT_View.changeMonth(-1)">◀</button>
                                    <button onclick="JFEVENT_View.goToday()">${JEEFORGE_t('today')}</button>
                                    <button onclick="JFEVENT_View.changeMonth(1)">▶</button>
                                </div>
                            </div>
                            <div class="jfevent-cal-grid">
                                ${dayLabels.map(l => `<div class="jfevent-cal-day-label">${l}</div>`).join('')}
                                ${daysHtml}
                            </div>
                        </div>
                    `;
            },

            renderPastEvents() {
                const past = JFEVENT_EventManager.getPastEvents().slice(0, 10);
                if (past.length === 0) return '';
                return `
                        <div style="margin-top:20px;">
                            <h4 style="font-size:16px;font-weight:700;margin-bottom:12px;">🕘 ${JEEFORGE_t('past_tests')} (${JFEVENT_EventManager.getPastEvents().length})</h4>
                            <div class="jfevent-event-grid">
                                ${past.map(event => this.renderEventCard(event)).join('')}
                            </div>
                            ${JFEVENT_EventManager.getPastEvents().length > 10 ? `<div style="text-align:center;margin-top:8px;"><button class="btn-outline btn-sm" onclick="JFEVENT_View.showAllPast()">${JEEFORGE_t('view_all')}</button></div>` : ''}
                        </div>
                    `;
            },

            showAllPast() {
                this.currentFilter = 'completed';
                this.currentSearch = '';
                this.render();
            },

            changeMonth(delta) {
                this.currentMonth += delta;
                if (this.currentMonth > 11) { this.currentMonth = 0;
                    this.currentYear++; }
                if (this.currentMonth < 0) { this.currentMonth = 11;
                    this.currentYear--; }
                this.render();
            },

            goToday() {
                const now = new Date();
                this.currentMonth = now.getMonth();
                this.currentYear = now.getFullYear();
                this.render();
            },

            goToDate(dateStr) {
                this.currentFilter = 'all';
                this.currentSearch = '';
                this.currentSearch = dateStr;
                this.render();
                setTimeout(() => {
                    this.currentSearch = '';
                }, 500);
            },

            setFilter(filter) {
                this.currentFilter = filter;
                this.currentSearch = '';
                this.render();
            },

            setSearch(val) {
                this.currentSearch = val;
                this.render();
            },

                overlay.querySelector('#jfevent_reminder').addEventListener('change', function() {

            saveCreateEvent(btn) {
                const overlay = btn.closest('.modal-overlay');
                const get = (id) => overlay.querySelector('#' + id)?.value || '';
                const name = get('jfevent_name').trim();
                if (!name) { ToastManager.show('Event name is required'); return; }
                const date = get('jfevent_date');
                if (!date) { ToastManager.show('Date is required'); return; }
                const reminder = get('jfevent_reminder') || 'none';

                    description: get('jfevent_description'),
                    reminder,
                    reminderCustom,
                    notes: get('jfevent_notes')
                };

                                                    <audio controls preload="metadata" style="width:100%;">
                                                        <source src="${m.data}" type="${m.mime || 'audio/mpeg'}">

                                                </div>
                                                <div class="jfevent-media-name">${m.name}</div>

                                            </div>`;
                                        } else {
                                            return `<div class="jfevent-media-item">
                                                <div class="jfevent-media-file-icon">📄</div>
                                                <div class="jfevent-media-name">${m.name}</div>
                                                <div style="font-size:10px;color:var(--text-secondary);">${fileSize}</div>
                                                <button class="jfevent-media-del" onclick="JFEVENT_View.deleteMedia('${m.id}','${id}')">✕</button>

                    const statusLabels = {
                        'upcoming': '🟢 ' + JEEFORGE_t('status_upcoming'),

                        'past': '🔵 ' + JEEFORGE_t('status_past'),
                        'completed': '✅ ' + JEEFORGE_t('status_completed'),
                        'cancelled': '🔴 ' + JEEFORGE_t('status_cancelled')
                    };

                    const overlay = ModalManager.open(`
                            <div style="font-size:14px;">
                                <h3 style="margin-bottom:4px;">${event.name}</h3>
                                <p class="text-secondary">${statusLabels[JFEVENT_EventManager.getEventStatus(event)] || '📅'}</p>
                                <div class="divider"></div>
                                <div style="display:flex;gap:12px;flex-wrap:wrap;margin:4px 0;">
                                    <span>📅 ${new Date(event.date).toLocaleDateString()}</span>

                                    ${event.location ? `<span>📍 ${event.location}</span>` : ''}
                                    <span class="tag">${event.category}</span>
                                </div>
                                ${event.description ? `<p><strong>${JEEFORGE_t('description')}:</strong> ${event.description}</p>` : ''}
                                ${event.notes ? `<p><strong>📝 ${JEEFORGE_t('notes')}:</strong> ${event.notes}</p>` : ''}
                                <p><strong>⏳ ${JEEFORGE_t('reminder')}:</strong> ${event.reminder === 'none' ? 'None' : event.reminder === 'custom' ? 'Custom' : event.reminder}</p>
                                ${event.reminderCustom ? `<p><strong>${JEEFORGE_t('custom_reminder')}:</strong> ${new Date(event.reminderCustom).toLocaleString()}</p>` : ''}
                                <div class="divider"></div>
                                <h4 style="font-size:14px;font-weight:700;margin-bottom:8px;">📸 ${JEEFORGE_t('media_vault') || 'Media Vault'}</h4>
                                ${mediaHtml}
                                <div class="divider"></div>
                                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                                    <button class="btn-outline btn-sm" onclick="JFEVENT_View.showUploadMedia('${event.id}')">📤 ${JEEFORGE_t('upload_media') || 'Upload Media'}</button>
                                    <button class="btn-outline btn-sm" onclick="JFEVENT_View.showVoiceRecorder('${event.id}')">🎙️ ${JEEFORGE_t('record_voice') || 'Record Voice'}</button>
                                    <button class="btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove();JFEVENT_View.showEditEvent('${event.id}')">✏️ ${JEEFORGE_t('edit')}</button>
                                    ${JFEVENT_EventManager.getEventStatus(event) !== 'completed' && JFEVENT_EventManager.getEventStatus(event) !== 'cancelled' ? `<button class="btn-outline btn-sm" onclick="JFEVENT_EventManager.markCompleted('${event.id}');this.closest('.modal-overlay').remove();JFEVENT_View.render();">✅ ${JEEFORGE_t('complete')}</button>` : ''}
                                </div>
                            </div>
                            <div class="modal-actions">
                                <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">${JEEFORGE_t('close')}</button>
                            </div>
                        `, `📖 ${event.name}`);
                }).catch(() => {
                    ToastManager.show('Error loading media');
                });
            },

            deleteEvent(id) {
                ModalManager.confirm(
                    'Are you sure you want to delete this event?\n\nThis will also remove all photos, videos, audio and documents attached to this event.',
                    () => {
                        JFEVENT_EventManager.deleteEvent(id);
                        this.render();
                    }
                );
            },

            async deleteMedia(mediaId, eventId) {
                ModalManager.confirm('Delete this media file?', async () => {
                    await JFEVENT_Storage.deleteMedia(mediaId);
                    ToastManager.show('Media deleted');
                    this.openEvent(eventId);
                });
            },

            showUploadMedia(eventId) {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*,video/*,audio/*,.pdf,.txt,.doc,.docx';
                input.multiple = true;
                input.onchange = async (e) => {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    let uploaded = 0;
                    for (const file of files) {
                        try {
                            let type = 'document';
                            if (file.type.startsWith('image/')) type = 'photo';
                            else if (file.type.startsWith('video/')) type = 'video';
                            else if (file.type.startsWith('audio/')) type = 'audio';
                            await JFEVENT_Storage.saveMedia(eventId, file, type);
                            uploaded++;
                        } catch (err) {
                            console.error('Upload failed:', err);
                        }
                    }
                    ToastManager.show(`📤 ${uploaded} file(s) uploaded`);
                    this.openEvent(eventId);
                };
                input.click();
            },

            showVoiceRecorder(eventId) {
                const overlay = ModalManager.open(`
                        <div style="font-size:14px;">
                            <h3 style="margin-bottom:8px;">🎙️ ${JEEFORGE_t('record_voice') || 'Record Voice Note'}</h3>
                            <div class="jfevent-voice-recorder">
                                <div id="jfevent_recorder_status" class="jfevent-recorder-status">${JEEFORGE_t('ready_to_record') || 'Ready to record'}</div>
                                <div class="jfevent-recorder-controls">
                                    <span id="jfevent_recorder_timer" class="jfevent-recorder-timer">00:00</span>
                                    <button class="btn-primary btn-sm" id="jfevent_rec_btn" onclick="JFEVENT_View.toggleRecording(this)">🔴 ${JEEFORGE_t('record') || 'Record'}</button>
                                    <button class="btn-outline btn-sm" id="jfevent_rec_play_btn" style="display:none;" onclick="JFEVENT_View.playRecording()">▶ ${JEEFORGE_t('play') || 'Play'}</button>
                                    <button class="btn-primary btn-sm" id="jfevent_rec_save_btn" style="display:none;" onclick="JFEVENT_View.saveRecording('${eventId}')">💾 ${JEEFORGE_t('save')}</button>
                                    <button class="btn-outline btn-sm" onclick="this.closest('.modal-overlay').remove();JFEVENT_View.openEvent('${eventId}')">${JEEFORGE_t('cancel')}</button>
                                </div>
                                <div style="margin-top:8px;font-size:12px;color:var(--text-secondary);" id="jfevent_rec_info"></div>
                            </div>
                        </div>
                    `, '🎙️ ' + (JEEFORGE_t('record_voice') || 'Voice Recorder'));
                this._recordingState = {
                    mediaRecorder: null,
                    chunks: [],
                    stream: null,
                    isRecording: false,
                    timer: 0,
                    timerInterval: null,
                    audioBlob: null,
                    audioUrl: null
                };
                const timerEl = document.getElementById('jfevent_recorder_timer');
                const statusEl = document.getElementById('jfevent_recorder_status');
                const recBtn = document.getElementById('jfevent_rec_btn');
                const playBtn = document.getElementById('jfevent_rec_play_btn');
                const saveBtn = document.getElementById('jfevent_rec_save_btn');
                const infoEl = document.getElementById('jfevent_rec_info');
                if (timerEl) timerEl.textContent = '00:00';
                if (statusEl) statusEl.textContent = 'Ready to record';
                if (recBtn) { recBtn.textContent = '🔴 ' + (JEEFORGE_t('record') || 'Record');
                    recBtn.style.display = 'inline-block'; }
                if (playBtn) playBtn.style.display = 'none';
                if (saveBtn) saveBtn.style.display = 'none';
                if (infoEl) infoEl.textContent = '';
                this._recordingOverlay = overlay;
            },

            toggleRecording(btn) {
                const state = this._recordingState;
                if (!state.isRecording) {
                    this.startRecording(btn);
                } else {
                    this.stopRecording(btn);
                }
            },

            async startRecording(btn) {
                const state = this._recordingState;
                const statusEl = document.getElementById('jfevent_recorder_status');
                const timerEl = document.getElementById('jfevent_recorder_timer');
                const infoEl = document.getElementById('jfevent_rec_info');

                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.stream = stream;
                    const mediaRecorder = new MediaRecorder(stream);
                    state.mediaRecorder = mediaRecorder;
                    state.chunks = [];
                    state.isRecording = true;
                    state.timer = 0;

                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) state.chunks.push(e.data);
                    };

                    mediaRecorder.onstop = () => {
                        const blob = new Blob(state.chunks, { type: 'audio/webm' });
                        state.audioBlob = blob;
                        state.audioUrl = URL.createObjectURL(blob);
                        if (statusEl) statusEl.textContent = '✅ ' + (JEEFORGE_t('recording_saved') ||
                            'Recording saved. Preview or save.');
                        const playBtn = document.getElementById('jfevent_rec_play_btn');
                        const saveBtn = document.getElementById('jfevent_rec_save_btn');
                        if (playBtn) playBtn.style.display = 'inline-block';
                        if (saveBtn) saveBtn.style.display = 'inline-block';
                        if (btn) btn.textContent = '🔴 ' + (JEEFORGE_t('record') || 'Record');
                        if (infoEl) infoEl.textContent = `📊 ${(blob.size / 1024).toFixed(1)} KB recorded`;
                        if (state.timerInterval) {
                            clearInterval(state.timerInterval);
                            state.timerInterval = null;
                        }
                    };

                    mediaRecorder.start();
                    if (btn) btn.textContent = '⏹️ ' + (JEEFORGE_t('stop') || 'Stop');
                    if (statusEl) statusEl.textContent = '🔴 ' + (JEEFORGE_t('recording') || 'Recording...');
                    if (infoEl) infoEl.textContent = 'Speak clearly...';

                    state.timerInterval = setInterval(() => {
                        state.timer++;
                        const mins = String(Math.floor(state.timer / 60)).padStart(2, '0');
                        const secs = String(state.timer % 60).padStart(2, '0');
                        if (timerEl) timerEl.textContent = `${mins}:${secs}`;
                        if (state.timer >= 300) {
                            this.stopRecording(document.getElementById('jfevent_rec_btn'));
                            ToastManager.show('⏱️ Max recording time reached (5 min)');
                        }
                    }, 1000);

                } catch (err) {
                    console.error('Microphone error:', err);
                    ToastManager.show('🎤 Microphone access unavailable. You can upload an audio file instead.');
                    if (statusEl) statusEl.textContent = '❌ Microphone unavailable';
                    if (btn) { btn.textContent = '🔴 ' + (JEEFORGE_t('record') || 'Record');
                        btn.disabled = true; }
                    const infoEl2 = document.getElementById('jfevent_rec_info');
                    if (infoEl2) infoEl2.innerHTML =
                        'Microphone access is unavailable. You can upload an audio file instead.';
                    const uploadBtn = document.createElement('button');
                    uploadBtn.className = 'btn-outline btn-sm';
                    uploadBtn.textContent = '📤 ' + (JEEFORGE_t('upload_audio') || 'Upload Audio');
                    uploadBtn.onclick = () => {
                        const input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'audio/*';
                        input.onchange = async (e) => {
                            const file = e.target.files[0];
                            if (file) {
                                try {
                                    await JFEVENT_Storage.saveMedia(this._currentEventId || 'unknown',
                                        file, 'audio');
                                    ToastManager.show('📤 Audio uploaded');
                                    this.openEvent(this._currentEventId || 'unknown');
                                    if (this._recordingOverlay) this._recordingOverlay.remove();
                                } catch (err) {
                                    ToastManager.show('Upload failed');
                                }
                            }
                        };
                        input.click();
                    };
                    if (infoEl2) infoEl2.appendChild(uploadBtn);
                }
            },

            stopRecording(btn) {
                const state = this._recordingState;
                if (state.mediaRecorder && state.isRecording) {
                    state.mediaRecorder.stop();
                    state.isRecording = false;
                    if (state.stream) {
                        state.stream.getTracks().forEach(t => t.stop());
                        state.stream = null;
                    }
                    if (btn) btn.textContent = '🔴 ' + (JEEFORGE_t('record') || 'Record');
                    const statusEl = document.getElementById('jfevent_recorder_status');
                    if (statusEl) statusEl.textContent = '⏹️ ' + (JEEFORGE_t('stopped') || 'Stopped');
                }
            },

            playRecording() {
                const state = this._recordingState;
                if (state.audioUrl) {
                    const audio = new Audio(state.audioUrl);
                    audio.play().catch(() => ToastManager.show('Playback error'));
                } else {
                    ToastManager.show('No recording to play');
                }
            },

            async saveRecording(eventId) {
                const state = this._recordingState;
                if (!state.audioBlob) {
                    ToastManager.show('No recording to save');
                    return;
                }
                try {
                    const entry = await JFEVENT_Storage.saveBlobMedia(
                        eventId,
                        state.audioBlob,
                        'Voice Note ' + new Date().toLocaleString() + '.webm',
                        'voice',
                        'audio/webm'
                    );
                    ToastManager.show('🎙️ Voice note saved!');
                    if (this._recordingOverlay) {
                        this._recordingOverlay.remove();
                    }
                    this.openEvent(eventId);
                } catch (err) {
                    console.error('Save voice error:', err);
                    ToastManager.show('Failed to save voice note');
                }
            },

            _currentEventId: null,
            _recordingState: {},
            _recordingOverlay: null
        };

        const origOpenEvent = JFEVENT_View.openEvent;
        JFEVENT_View.openEvent = function(id) {
            this._currentEventId = id;
            origOpenEvent.call(this, id);
        };

        // ============================================================
        // ===== JFEORGE PREMIUM EXAM COUNTDOWN =====
        // ============================================================
        const JFEORGE_ExamCountdown = {
            EXAMS: {
                'jee-main-2027': {
                    id: 'jee-main-2027',
                    label: 'JEE Main 2027',
                    icon: '⚡',
                    date: '2027-01-23',
                    time: '09:00',
                    fullDate: '2027-01-23T09:00:00'
                },
                'jee-advanced-2027': {
                    id: 'jee-advanced-2027',
                    label: 'JEE Advanced 2027',
                    icon: '🔥',
                    date: '2027-05-30',
                    time: '09:00',
                    fullDate: '2027-05-30T09:00:00'
                }
            },
            MOTIVATIONAL_MESSAGES: [
                'Every day counts. Keep forging. 🔥',
                'Small steps lead to big results. 📈',
                'Stay consistent. Stay focused. 🎯',
                'Your future self is counting on you. 💪',
                'One day, all your hard work will pay off. ✨',
                'The comeback is always greater than the setback. 🚀',
                'Discipline is choosing between what you want now and what you want most. 🏆',
                'Pressure is a privilege. Embrace it. 💎'
            ],
            _tickerInterval: null,
            _lastValues: null,

            getStorage() {
                const raw = localStorage.getItem('jfeorge_exam_countdown_data');
                try {
                    return raw ? JSON.parse(raw) : {
                        selected: 'jee-main-2027',
                        custom: null,
                        startDate: null
                    };
                } catch { return { selected: 'jee-main-2027', custom: null, startDate: null }; }
            },
            saveStorage(data) {
                localStorage.setItem('jfeorge_exam_countdown_data', JSON.stringify(data));
            },
            getSelectedExam() {
                const store = this.getStorage();
                return store.selected || 'jee-main-2027';
            },
            getCustomExam() {
                const store = this.getStorage();
                return store.custom || null;
            },
            getStartDate() {
                const store = this.getStorage();
                if (store.startDate) return new Date(store.startDate);
                const fallback = new Date();
                fallback.setDate(fallback.getDate() - 60);
                return fallback;
            },
            getTargetDate() {
                const selected = this.getSelectedExam();
                if (selected === 'custom') {
                    const custom = this.getCustomExam();
                    if (custom && custom.date && custom.time) {
                        return new Date(custom.date + 'T' + (custom.time || '00:00'));
                    }
                    return new Date('2027-01-23T09:00:00');
                }
                const exam = this.EXAMS[selected];
                if (!exam) return new Date('2027-01-23T09:00:00');
                return new Date(exam.fullDate);
            },
            getExamLabel() {
                const selected = this.getSelectedExam();
                if (selected === 'custom') {
                    const custom = this.getCustomExam();
                    if (custom && custom.name) return custom.name;
                    return 'Custom Exam';
                }
                const exam = this.EXAMS[selected];
                return exam ? exam.label : 'JEE Main 2027';
            },
            getExamIcon() {
                const selected = this.getSelectedExam();
                if (selected === 'custom') return '➡️';
                const exam = this.EXAMS[selected];
                return exam ? exam.icon : '⚡';
            },
            getExamDateDisplay() {
                const selected = this.getSelectedExam();
                if (selected === 'custom') {
                    const custom = this.getCustomExam();
                    if (custom && custom.date) {
                        const d = new Date(custom.date);
                        return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                    }
                    return '—';
                }
                const exam = this.EXAMS[selected];
                if (!exam) return '—';
                const d = new Date(exam.fullDate);
                return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            },
            getExamTimeDisplay() {
                const selected = this.getSelectedExam();
                if (selected === 'custom') {
                    const custom = this.getCustomExam();
                    if (custom && custom.time) return custom.time;
                    return '—';
                }
                const exam = this.EXAMS[selected];
                if (!exam) return '—';
                const d = new Date(exam.fullDate);
                return d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            },
            getCountdown() {
                const target = this.getTargetDate();
                const now = new Date();
                const diff = target.getTime() - now.getTime();
                if (diff <= 0) {
                    return { days: 0, hours: 0, minutes: 0, seconds: 0, total: 0, isExpired: true };
                }
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                return { days, hours, minutes, seconds, total: diff, isExpired: false };
            },
            getProgress() {
                const target = this.getTargetDate();
                const now = new Date();
                const start = this.getStartDate();
                const total = target.getTime() - start.getTime();
                const elapsed = now.getTime() - start.getTime();
                if (total <= 0) return { percent: 0, elapsedDays: 0, totalDays: 0, remainingDays: 0 };
                const percent = Math.min(100, Math.max(0, (elapsed / total) * 100));
                const elapsedDays = Math.max(0, Math.floor(elapsed / (1000 * 60 * 60 * 24)));
                const totalDays = Math.max(1, Math.floor(total / (1000 * 60 * 60 * 24)));
                const remainingDays = Math.max(0, totalDays - elapsedDays);
                return { percent: Math.round(percent * 10) / 10, elapsedDays, totalDays, remainingDays };
            },
            selectExam(examId) {
                const store = this.getStorage();
                store.selected = examId;
                if (examId !== 'custom') {
                    store.custom = null;
                }
                this.saveStorage(store);
                if (!store.startDate) {
                    store.startDate = new Date().toISOString();
                    this.saveStorage(store);
                }
                this.render();
                this.startTicker();
                ToastManager.show('🎯 Switched to ' + this.getExamLabel());
            },
            setCustomExam(name, date, time) {
                const store = this.getStorage();
                store.selected = 'custom';
                store.custom = { name: name.trim(), date, time: time || '00:00' };
                if (!store.startDate) {
                    store.startDate = new Date().toISOString();
                }
                this.saveStorage(store);
                this.render();
                this.startTicker();
                ToastManager.show('✅ Custom exam set: ' + name);
            },
            render() {
                const cd = this.getCountdown();
                const progress = this.getProgress();
                const label = this.getExamLabel();
                const icon = this.getExamIcon();
                const dateDisplay = this.getExamDateDisplay();
                const timeDisplay = this.getExamTimeDisplay();
                const selected = this.getSelectedExam();
                const msgIdx = new Date().getDate() % this.MOTIVATIONAL_MESSAGES.length;
                const msg = this.MOTIVATIONAL_MESSAGES[msgIdx];

                let boxesHtml = '';
                if (cd.isExpired) {
                    const isToday = this.getTargetDate().toDateString() === new Date().toDateString();
                    const statusText = isToday ? '🏁 EXAM DAY' : '✅ EXAM COMPLETED';
                    boxesHtml = `
                            <div class="jfeorge-countdown-box" style="grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent);">
                                <div class="jfeorge-box-completed">
                                    <span class="jfeorge-check-icon">${isToday ? '🏁' : '🎉'}</span>
                                    ${statusText}
                                </div>
                                <div class="jfeorge-box-label">${isToday ? 'Good luck! 🔥' : 'You gave it your all!'}</div>
                                <div class="jfeorge-box-accent"></div>
                            </div>
                        `;
                } else {
                    const boxes = [
                        { value: cd.days, label: 'DAYS', key: 'days' },
                        { value: cd.hours, label: 'HOURS', key: 'hours' },
                        { value: cd.minutes, label: 'MINUTES', key: 'minutes' },
                        { value: cd.seconds, label: 'SECONDS', key: 'seconds' }
                    ];
                    boxesHtml = boxes.map((b, idx) => {
                        const valStr = String(b.value).padStart(2, '0');
                        return `
                                <div class="jfeorge-countdown-box" data-box-key="${b.key}">
                                    <div class="jfeorge-box-number" id="jfeorge_num_${b.key}">${valStr}</div>
                                    <div class="jfeorge-box-label">${b.label}</div>
                                    <div class="jfeorge-box-accent"></div>
                                </div>
                            `;
                    }).join('');
                }

                const progPct = progress.percent || 0;
                const progFill = Math.min(100, progPct);

                return `
                        <div class="jfeorge-countdown-wrap" id="jfeorgeCountdownWrap">
                            <div class="jfeorge-countdown-top">
                                <div class="jfeorge-countdown-target">
                                    <div class="jfeorge-target-label">🎯 YOUR CURRENT TARGET</div>
                                    <div class="jfeorge-target-name">${icon} ${label}</div>
                                    <div class="jfeorge-target-date">
                                        <span>📅 ${dateDisplay}</span>
                                        <span>⏰ ${timeDisplay}</span>
                                    </div>
                                </div>
                                <div class="jfeorge-exam-selector-wrap">
                                    <button class="jfeorge-exam-selector-btn" onclick="JFEORGE_ExamCountdown.toggleDropdown()" id="jfeorgeSelectorBtn">
                                        <span>Switch</span>
                                        <span class="jfeorge-arrow" id="jfeorgeArrow">▼</span>
                                    </button>
                                    <div class="jfeorge-exam-dropdown" id="jfeorgeDropdown">
                                        <button class="jfeorge-exam-option ${selected === 'jee-main-2027' ? 'active-opt' : ''}" onclick="JFEORGE_ExamCountdown.selectExam('jee-main-2027');JFEORGE_ExamCountdown.closeDropdown();">
                                            <span class="jfeorge-opt-icon">⚡</span> JEE Main 2027
                                            ${selected === 'jee-main-2027' ? '<span class="jfeorge-opt-check">✓</span>' : ''}
                                        </button>
                                        <button class="jfeorge-exam-option ${selected === 'jee-advanced-2027' ? 'active-opt' : ''}" onclick="JFEORGE_ExamCountdown.selectExam('jee-advanced-2027');JFEORGE_ExamCountdown.closeDropdown();">
                                            <span class="jfeorge-opt-icon">🔥</span> JEE Advanced 2027
                                            ${selected === 'jee-advanced-2027' ? '<span class="jfeorge-opt-check">✓</span>' : ''}
                                        </button>
                                        <div class="jfeorge-divider"></div>
                                        <button class="jfeorge-exam-option ${selected === 'custom' ? 'active-opt' : ''}" onclick="JFEORGE_ExamCountdown.closeDropdown();JFEORGE_ExamCountdown.showCustomExamModal();">
                                            <span class="jfeorge-opt-icon">➡️</span> Custom Exam
                                            ${selected === 'custom' ? '<span class="jfeorge-opt-check">✓</span>' : ''}
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <div class="jfeorge-countdown-boxes" id="jfeorgeBoxes">
                                ${boxesHtml}
                            </div>

                            <div class="jfeorge-progress-section">
                                <div class="jfeorge-progress-header">
                                    <span class="jfeorge-progress-label">📊 Preparation Timeline</span>
                                    <span class="jfeorge-progress-pct">${progFill}%</span>
                                </div>

                                </div>

                                    <span>📅 Days remaining: <strong>${progress.remainingDays}</strong></span>

                            </div>

                            <div class="jfeorge-motivation">
                                <span class="jfeorge-mot-icon">🔥</span> ${msg}
                            </div>
                        </div>
                    `;
            },
            toggleDropdown() {
                const dd = document.getElementById('jfeorgeDropdown');
                const arrow = document.getElementById('jfeorgeArrow');
                if (!dd) return;
                const isOpen = dd.classList.contains('open');
                if (isOpen) {
                    dd.classList.remove('open');
                    if (arrow) arrow.classList.remove('open');
                } else {
                    dd.classList.add('open');
                    if (arrow) arrow.classList.add('open');
                }
            },
            closeDropdown() {
                const dd = document.getElementById('jfeorgeDropdown');
                const arrow = document.getElementById('jfeorgeArrow');
                if (dd) dd.classList.remove('open');
                if (arrow) arrow.classList.remove('open');
            },
            showCustomExamModal() {
                const overlay = ModalManager.open(`
                        <div style="font-size:14px;">
                            <h3 style="margin-bottom:8px;">➡️ Custom Exam</h3>
                            <p class="text-secondary" style="margin-bottom:12px;">Set your own target exam date and time.</p>
                            <div class="form-group">
                                <label>Exam Name *</label>
                                <input id="jfeorge_custom_name" placeholder="e.g. School Pre-Board" value="${this.getCustomExam()?.name || ''}">
                            </div>
                            <div class="form-group">
                                <label>Exam Date *</label>
                                <input type="date" id="jfeorge_custom_date" value="${this.getCustomExam()?.date || new Date().toISOString().split('T')[0]}">
                            </div>
                            <div class="form-group">
                                <label>Exam Time</label>
                                <input type="time" id="jfeorge_custom_time" value="${this.getCustomExam()?.time || '09:00'}">
                            </div>
                            <div class="modal-actions">
                                <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                                <button class="btn-primary" onclick="JFEORGE_ExamCountdown.saveCustomExam(this)">Save Custom Exam</button>
                            </div>
                        </div>
                    `, '➡️ Custom Exam');
            },
            saveCustomExam(btn) {
                const overlay = btn.closest('.modal-overlay');
                const name = overlay.querySelector('#jfeorge_custom_name')?.value?.trim() || '';
                const date = overlay.querySelector('#jfeorge_custom_date')?.value || '';
                const time = overlay.querySelector('#jfeorge_custom_time')?.value || '00:00';
                if (!name) { ToastManager.show('Please enter an exam name.'); return; }
                if (!date) { ToastManager.show('Please select a date.'); return; }
                this.setCustomExam(name, date, time);
                overlay.remove();
                this.closeDropdown();
            },
            startTicker() {
                if (this._tickerInterval) {
                    clearInterval(this._tickerInterval);
                    this._tickerInterval = null;
                }
                this.updateNumbers();
                this._tickerInterval = setInterval(() => {
                    this.updateNumbers();
                }, 1000);
            },
            updateNumbers() {
                const cd = this.getCountdown();
                if (cd.isExpired) {
                    if (ViewManager.currentView === 'dashboard') {
                        const boxes = document.getElementById('jfeorgeBoxes');
                        if (boxes) {
                            const hasNumberBoxes = boxes.querySelector('.jfeorge-box-number');
                            if (hasNumberBoxes) {
                                this.render();
                            }
                        }
                    }
                    return;
                }
                const keys = ['days', 'hours', 'minutes', 'seconds'];
                const values = [cd.days, cd.hours, cd.minutes, cd.seconds];
                keys.forEach((key, idx) => {
                    const el = document.getElementById('jfeorge_num_' + key);
                    if (!el) return;
                    const newVal = String(values[idx]).padStart(2, '0');
                    const oldVal = el.textContent;
                    if (newVal !== oldVal) {
                        el.textContent = newVal;
                        el.classList.remove('jfeorge-number-flip');
                        void el.offsetWidth;
                        el.classList.add('jfeorge-number-flip');
                    }
                });
                const progress = this.getProgress();
                const fill = document.querySelector('.jfeorge-progress-fill');
                const pctEl = document.querySelector('.jfeorge-progress-pct');
                const daysCompEl = document.querySelector('.jfeorge-progress-days span:first-child strong');
                const daysRemEl = document.querySelector('.jfeorge-progress-days span:last-child strong');
                if (fill) {
                    const current = parseFloat(fill.style.width) || 0;
                    const target = Math.min(100, progress.percent || 0);
                    if (Math.abs(current - target) > 0.1) {
                        fill.style.width = target + '%';
                    }
                }
                if (pctEl) {
                    const currentPct = parseInt(pctEl.textContent) || 0;
                    const newPct = Math.round(progress.percent || 0);
                    if (currentPct !== newPct) {
                        pctEl.textContent = newPct + '%';
                    }
                }
                if (daysCompEl) {
                    daysCompEl.textContent = progress.elapsedDays;
                }
                if (daysRemEl) {
                    daysRemEl.textContent = progress.remainingDays;
                }
            },
            init() {
                const store = this.getStorage();
                if (!store.startDate) {
                    store.startDate = new Date().toISOString();
                    this.saveStorage(store);
                }
                if (store.selected === 'custom' && store.custom && !store.custom.date) {
                    store.custom.date = new Date().toISOString().split('T')[0];
                    this.saveStorage(store);
                }
                this.startTicker();
                document.addEventListener('click', (e) => {
                    const wrap = document.querySelector('.jfeorge-exam-selector-wrap');
                    if (wrap && !wrap.contains(e.target)) {
                        this.closeDropdown();
                    }
                });
                const observer = new MutationObserver(() => {
                    if (ViewManager.currentView === 'dashboard') {
                        this.updateNumbers();
                    }
                });
                observer.observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
            }
        };
