        };

        // ============================================================
        // SYLLABUS VIEW (unchanged)
        // ============================================================
        const SyllabusView = {
            currentClass: 11,
            currentSubject: 'Physics',
            currentChapter: null,
            render() {
                const view = document.getElementById('syllabusView');
                view.innerHTML = `
                        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;">
                            <button class="${this.currentClass===11?'btn-primary':'btn-outline'}" onclick="SyllabusView.setClass(11)">Class 11</button>
                            <button class="${this.currentClass===12?'btn-primary':'btn-outline'}" onclick="SyllabusView.setClass(12)">Class 12</button>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">
                            ${['Physics','Chemistry','Mathematics'].map(s => 
                                `<button class="${this.currentSubject===s?'btn-primary btn-sm':'btn-outline btn-sm'}" onclick="SyllabusView.setSubject('${s}')">${s}</button>`
                            ).join('')}
                        </div>
                        <div class="syllabus-section">
                            <h2>${this.currentSubject} — Class ${this.currentClass}</h2>
                            <div id="chapterList">
                                ${this.renderChapterList()}
                            </div>
                        </div>
                        <div id="chapterDetail"></div>
                    `;
            },
            renderChapterList() {
                const chapters = SyllabusDB['class' + this.currentClass][this.currentSubject] || [];
                return chapters.map(ch => {
                    const progress = ProgressManager.getChapterProgress(this.currentClass, this.currentSubject, ch
                        .chapter);
                    const subtopicCount = SyllabusDB.getSubtopicCount(this.currentClass, this.currentSubject, ch
                        .chapter);
                    return `
                            <div class="chapter-card" onclick="SyllabusView.openChapter('${ch.chapter}')">
                                <div class="chapter-header">
                                    <span class="chapter-name">${ch.chapter}</span>
                                    <span class="chapter-progress">${progress}% · ${subtopicCount} subtopics</span>
                                </div>
                                <div class="progress-bar" style="margin-top:8px;">
                                    <div class="progress-fill" style="width:${progress}%"></div>
                                </div>
                            </div>
                        `;
                }).join('');
            },
            openChapter(chapterName) {
                this.currentChapter = chapterName;
                const ch = SyllabusDB['class' + this.currentClass][this.currentSubject].find(c => c.chapter === chapterName);
                if (!ch) return;
                const progress = ProgressManager.getChapterProgress(this.currentClass, this.currentSubject, chapterName);
                const detailEl = document.getElementById('chapterDetail');
                detailEl.innerHTML = `
                        <div class="card" style="margin-top:16px;">
                            <div class="flex-between">
                                <h3 style="font-size:18px;font-weight:700;">${chapterName}</h3>
                                <span class="text-accent" style="font-weight:700;">${progress}%</span>
                            </div>
                            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                            <div class="divider"></div>
                            ${ch.topics.map(t => `
                                <div style="margin-bottom:16px;">
                                    <div style="font-weight:700;font-size:14px;margin-bottom:8px;color:var(--accent);">${t.name}</div>
                                    ${t.subtopics.map(st => {
                                        const isDone = ProgressManager.isCompleted(this.currentClass, this.currentSubject, chapterName, t.name, st);
                                        return `<div class="subtopic-item" onclick="SyllabusView.toggleSubtopic('${chapterName}','${t.name}','${st}')">
                                            <input type="checkbox" ${isDone?'checked':''} onclick="event.stopPropagation();SyllabusView.toggleSubtopic('${chapterName}','${t.name}','${st}')">
                                            <span class="subtopic-name">${st}</span>
                                        </div>`;
                                    }).join('')}
                                </div>
                            `).join('')}
                        </div>
                    `;
                detailEl.scrollIntoView({ behavior: 'smooth' });
            },
            toggleSubtopic(chapter, topic, subtopic) {
                ProgressManager.toggleSubtopic(this.currentClass, this.currentSubject, chapter, topic, subtopic);
                this.render();
                this.openChapter(chapter);
                DashboardManager.updateDashboard();
            },
            setClass(cls) { this.currentClass = cls;
                this.currentChapter = null;
                this.render(); },
            setSubject(subj) { this.currentSubject = subj;
                this.currentChapter = null;
                this.render(); }
        };

        // ============================================================
        // ERROR SPACE VIEW (unchanged)
        // ============================================================
        const ErrorSpaceView = {
            currentFolder: null,
            searchTerm: '',
            filter: 'all',
            render() {
                const view = document.getElementById('errorspaceView');
                const folders = appState.errorFolders.filter(f => f.userId === appState.currentUser?.id);
                const questions = appState.errorQuestions.filter(q => q.userId === appState.currentUser?.id);
                if (this.currentFolder) {
                    const folder = folders.find(f => f.id === this.currentFolder);
                    if (folder) {
                        const folderQuestions = questions.filter(q => q.folderId === folder.id);
                        const filtered = folderQuestions.filter(q => {
                            if (this.filter === 'pending') return q.status !== 'fixed';
                            if (this.filter === 'fixed') return q.status === 'fixed';
                            if (this.filter === 'revisit') return q.status === 'revisit';
                            if (this.filter === 'Physics' || this.filter === 'Chemistry' || this.filter ===
                                'Mathematics') return q.subject === this.filter;
                            return true;
                        }).filter(q => this.searchTerm === '' || (q.title + q.chapter + q.topic + q.mistakeType +
                            q.tags).toLowerCase().includes(this.searchTerm.toLowerCase()));
                        view.innerHTML = `
                                <div class="flex-between" style="margin-bottom:12px;">
                                    <button class="btn-outline btn-sm" onclick="ErrorSpaceView.goBack()">← Back to Folders</button>
                                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                                        <button class="btn-primary btn-sm" onclick="ErrorSpaceView.showAddQuestion()">+ Add Question</button>
                                        <button class="btn-danger btn-sm" onclick="ErrorSpaceView.deleteFolder('${folder.id}')">Delete Folder</button>
                                    </div>
                                </div>
                                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
                                    <input placeholder="Search..." value="${this.searchTerm}" oninput="ErrorSpaceView.search(this.value)" style="flex:1;min-width:200px;">
                                    <select onchange="ErrorSpaceView.setFilter(this.value)">
                                        <option value="all" ${this.filter==='all'?'selected':''}>All</option>
                                        <option value="pending" ${this.filter==='pending'?'selected':''}>Pending</option>
                                        <option value="fixed" ${this.filter==='fixed'?'selected':''}>Fixed</option>
                                        <option value="revisit" ${this.filter==='revisit'?'selected':''}>Revisit</option>
                                        <option value="Physics" ${this.filter==='Physics'?'selected':''}>Physics</option>
                                        <option value="Chemistry" ${this.filter==='Chemistry'?'selected':''}>Chemistry</option>
                                        <option value="Mathematics" ${this.filter==='Mathematics'?'selected':''}>Mathematics</option>
                                    </select>
                                </div>
                                <h3 style="font-size:16px;margin-bottom:8px;">${folder.name} (${filtered.length})</h3>
                                ${filtered.length === 0 ? '<div class="empty-state"><div class="empty-icon">📂</div><p>No questions in this folder.</p></div>' : 
                                    filtered.map(q => `
                                        <div class="error-card">
                                            <div class="error-header">
                                                <span class="error-title">Q#${q.id.slice(-4)} — ${q.title || 'Untitled'}</span>
                                                <span class="error-badge ${q.status==='fixed'?'fixed':q.status==='revisit'?'':'pending'}">${q.status.toUpperCase()}</span>
                                            </div>
                                            <div class="error-meta">
                                                <span>${q.subject}</span>
                                                <span>${q.chapter}</span>
                                                <span>★${q.difficulty || 3}</span>
                                                <span>${q.mistakeType}</span>
                                            </div>
                                            ${q.imageId ? `<img src="" id="img_${q.id}" style="max-width:200px;margin-top:8px;" onerror="this.style.display='none'">` : ''}
                                            <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
                                                <button class="btn-outline btn-sm" onclick="ErrorSpaceView.openQuestion('${q.id}')">Open</button>
                                                <button class="btn-outline btn-sm" onclick="ErrorSpaceView.markFixed('${q.id}')">${q.status==='fixed'?'Reopen':'Mark Fixed'}</button>
                                                <button class="btn-danger btn-sm" onclick="ErrorSpaceView.deleteQuestion('${q.id}')">Delete</button>
                                            </div>
                                        </div>
                                    `).join('')}
                            `;
                        filtered.forEach(q => {
                            if (q.imageId) {
                                StorageManager.indexedDB.getImage(q.imageId).then(dataUrl => {
                                    const img = document.getElementById('img_' + q.id);
                                    if (img && dataUrl) img.src = dataUrl;
                                }).catch(() => {});
                            }
                        });
                    } else { this.currentFolder = null;
                        this.render(); }
                } else {
                    view.innerHTML = `
                            <div class="flex-between" style="margin-bottom:16px;">
                                <h3 style="font-size:18px;font-weight:700;">🧠 Error Space</h3>
                                <button class="btn-primary btn-sm" onclick="ErrorSpaceView.showCreateFolder()">+ Create Folder</button>
                            </div>
                            ${folders.length === 0 ? `
                                <div class="empty-state">
                                    <div class="empty-icon">🧠</div>
                                    <p>No folders yet. Create a folder to start tracking your mistakes.</p>
                                    <button class="btn-primary" onclick="ErrorSpaceView.showCreateFolder()">Create First Folder</button>
                                </div>
                            ` : `
                                <div class="folder-grid">
                                    ${folders.map(f => {
                                        const count = questions.filter(q => q.folderId === f.id).length;
                                        const fixedCount = questions.filter(q => q.folderId === f.id && q.status === 'fixed').length;
                                        return `<div class="folder-card" onclick="ErrorSpaceView.openFolder('${f.id}')">
                                            <div class="folder-icon">📁</div>
                                            <div class="folder-name">${f.name}</div>
                                            <div class="folder-count">${count} questions · ${fixedCount} fixed</div>
                                        </div>`;
                                    }).join('')}
                                </div>
                                <div class="card mt-16">
                                    <h3>📊 Error Statistics</h3>
                                    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;">
                                        <div><strong>Total:</strong> ${questions.length}</div>
                                        <div><strong>Fixed:</strong> ${questions.filter(q=>q.status==='fixed').length}</div>
                                        <div><strong>Pending:</strong> ${questions.filter(q=>q.status!=='fixed').length}</div>
                                        <div><strong>Physics:</strong> ${questions.filter(q=>q.subject==='Physics').length}</div>
                                        <div><strong>Chemistry:</strong> ${questions.filter(q=>q.subject==='Chemistry').length}</div>
                                        <div><strong>Maths:</strong> ${questions.filter(q=>q.subject==='Mathematics').length}</div>
                                    </div>
                                </div>
                            `}
                        `;
                }
            },
            goBack() { this.currentFolder = null;
                this.render(); },
            openFolder(id) { this.currentFolder = id;
                this.searchTerm = '';
                this.filter = 'all';
                this.render(); },
            showCreateFolder() {
                const overlay = ModalManager.open(`
                        <div class="form-group"><label>Folder Name</label><input id="folderName" placeholder="e.g. Rotation"></div>
                        <div class="form-group"><label>Subject</label><select id="folderSubject">
                            <option>Physics</option><option>Chemistry</option><option>Mathematics</option><option>General</option>
                        </select></div>
                        <div class="form-group"><label>Description</label><textarea id="folderDesc" placeholder="Optional description"></textarea></div>
                        <div class="modal-actions">
                            <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="btn-primary" onclick="ErrorSpaceView.createFolder(this)">Create Folder</button>
                        </div>
                    `, 'Create Error Folder');
            },
            createFolder(btn) {
                const overlay = btn.closest('.modal-overlay');
                const name = overlay.querySelector('#folderName').value.trim();
                const subject = overlay.querySelector('#folderSubject').value;
                const description = overlay.querySelector('#folderDesc').value.trim();
                if (!name) { ToastManager.show('Folder name is required'); return; }
                const folder = { id: Date.now().toString(), name, subject, description, userId: appState.currentUser.id,
                    createdAt: new Date().toISOString() };
                appState.errorFolders.push(folder);
                StorageManager.set('errorFolders', appState.errorFolders);
                overlay.remove();
                this.render();
                ToastManager.show('Folder created!');
            },
            deleteFolder(id) {
                ModalManager.confirm('Delete this folder and all its questions?', () => {
                    appState.errorFolders = appState.errorFolders.filter(f => f.id !== id);
                    appState.errorQuestions = appState.errorQuestions.filter(q => q.folderId !== id);
                    StorageManager.set('errorFolders', appState.errorFolders);
                    StorageManager.set('errorQuestions', appState.errorQuestions);
                    this.currentFolder = null;
                    this.render();
                    ToastManager.show('Folder deleted');
                });
            },
            showAddQuestion() {
                const subjects = ['Physics', 'Chemistry', 'Mathematics'];
                const mistakeTypes = ['Conceptual Mistake', 'Formula Mistake', 'Calculation Mistake', 'Silly Mistake',
                    'Misread Question', 'Time Management', 'Guessing', 'Incomplete Concept', 'Other'
                ];
                const overlay = ModalManager.open(`
                        <div class="form-group"><label>Question Title</label><input id="qTitle" placeholder="e.g. Torque sign error"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <div class="form-group"><label>Subject</label><select id="qSubject">${subjects.map(s=>`<option>${s}</option>`).join('')}</select></div>
                            <div class="form-group"><label>Class</label><select id="qClass"><option value="11">Class 11</option><option value="12">Class 12</option></select></div>
                        </div>
                        <div class="form-group"><label>Chapter</label><input id="qChapter" placeholder="e.g. Rotational Motion"></div>
                        <div class="form-group"><label>Topic</label><input id="qTopic" placeholder="e.g. Torque"></div>
                        <div class="form-group"><label>Difficulty (1-5)</label><input type="number" id="qDifficulty" min="1" max="5" value="3"></div>
                        <div class="form-group"><label>Mistake Type</label><select id="qMistakeType">${mistakeTypes.map(m=>`<option>${m}</option>`).join('')}</select></div>
                        <div class="form-group"><label>Upload Question Image</label><input type="file" id="qImage" accept="image/png,image/jpeg,image/jpg,image/webp" onchange="ErrorSpaceView.previewImage(this)"></div>
                        <div id="qImagePreview" style="margin-top:8px;"></div>
                        <div class="form-group"><label>Your Answer</label><input id="qYourAnswer" placeholder="What did you answer?"></div>
                        <div class="form-group"><label>Correct Answer</label><input id="qCorrectAnswer" placeholder="What is the correct answer?"></div>
                        <div class="form-group"><label>What Went Wrong?</label><textarea id="qWentWrong" placeholder="Describe what went wrong..."></textarea></div>
                        <div class="form-group"><label>Correct Approach</label><textarea id="qApproach" placeholder="How should you approach this?"></textarea></div>
                        <div class="form-group"><label>Lesson Learned</label><textarea id="qLesson" placeholder="What did you learn?"></textarea></div>
                        <div class="form-group"><label>Tags (comma separated)</label><input id="qTags" placeholder="e.g. sign convention, torque"></div>
                        <div class="modal-actions">
                            <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="btn-primary" onclick="ErrorSpaceView.saveQuestion(this)">Save Question</button>
                        </div>
                    `, 'Add Error Question');
                overlay.querySelector('#qTitle').focus();
            },
            previewImage(input) {
                const file = input.files[0];
                const preview = document.getElementById('qImagePreview');
                if (!file) { preview.innerHTML = ''; return; }
                if (!['image/png', 'image/jpeg', 'image/jpg', 'image/webp'].includes(file.type)) { ToastManager.show(
                        'Unsupported image format'); return; }
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.innerHTML =
                        `<img src="${e.target.result}" style="max-width:200px;max-height:150px;border-radius:8px;">`;
                    preview.dataset.imageData = e.target.result;
                };
                reader.readAsDataURL(file);
            },
            async saveQuestion(btn) {
                const overlay = btn.closest('.modal-overlay');
                const get = (id) => overlay.querySelector('#' + id)?.value || '';
                const title = get('qTitle');
                if (!title) { ToastManager.show('Title is required'); return; }
                const imageData = document.getElementById('qImagePreview')?.dataset?.imageData || null;
                let imageId = null;
                if (imageData) { imageId = 'img_' + Date.now().toString();
                    await StorageManager.indexedDB.saveImage(imageId, imageData); }
                const question = { id: Date.now().toString(), userId: appState.currentUser.id, folderId: this
                        .currentFolder, title, subject: get('qSubject') || 'Physics', classNum: get('qClass') || '11',
                    chapter: get('qChapter'), topic: get('qTopic'), difficulty: parseInt(get('qDifficulty')) || 3,
                    mistakeType: get('qMistakeType') || 'Other', yourAnswer: get('qYourAnswer'), correctAnswer: get(
                        'qCorrectAnswer'), wentWrong: get('qWentWrong'), approach: get('qApproach'), lesson: get(
                        'qLesson'), tags: get('qTags'), imageId, status: 'pending', reviewCount: 0, lastReviewed: null,
                    createdAt: new Date().toISOString() };
                appState.errorQuestions.push(question);
                StorageManager.set('errorQuestions', appState.errorQuestions);
                overlay.remove();
                this.render();
                ToastManager.show('Error question added!');
            },
            openQuestion(id) {
                const q = appState.errorQuestions.find(e => e.id === id);
                if (!q) return;
                q.reviewCount = (q.reviewCount || 0) + 1;
                q.lastReviewed = new Date().toISOString();
                StorageManager.set('errorQuestions', appState.errorQuestions);
                const overlay = ModalManager.open(`

            render() {

                const sortedTests = [...tests].sort((a, b) => new Date(b.date) - new Date(a.date));

                        ` : `
                            <div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr));">
                                ${sortedTests.map(t => {
                                    const totalScore = (t.physicsScore||0)+(t.chemistryScore||0)+(t.mathsScore||0);
                                    const maxMarks = t.maxMarks || 300;
                                    const percent = Math.round((totalScore/maxMarks)*100);
                                    return `<div class="card">
                                        <h3 style="font-size:14px;font-weight:700;">${t.name}</h3>
                                        <div class="card-sub">${t.type} · ${new Date(t.date).toLocaleDateString()}</div>
                                        <div class="card-value" style="font-size:22px;">${totalScore}/${maxMarks}</div>
                                        <div class="progress-bar"><div class="progress-fill" style="width:${percent}%"></div></div>
                                        <div class="card-sub">${percent}% · P:${t.physicsScore||0} C:${t.chemistryScore||0} M:${t.mathsScore||0}</div>
                                        <button class="btn-outline btn-sm mt-16" onclick="TestsView.analyzeTest('${t.id}')">Analyze</button>
                                    </div>`;
                                }).join('')}
                            </div>
                            <div class="card mt-16">
                                <h3>📈 Score Progression</h3>
                                <canvas id="testChart" height="200"></canvas>
                            </div>
                        `}
                    `;
                if (tests.length > 1) this.drawChart(tests);
            },
            drawChart(tests) {
                const canvas = document.getElementById('testChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const sorted = [...tests].sort((a, b) => new Date(a.date) - new Date(b.date));
                const scores = sorted.map(t => (t.physicsScore || 0) + (t.chemistryScore || 0) + (t.mathsScore || 0));
                const maxScore = Math.max(...scores, 1);
                const padding = 40;
                const w = canvas.width || canvas.parentElement.clientWidth || 600;
                const h = 200;
                canvas.width = w;
                canvas.height = h;
                ctx.clearRect(0, 0, w, h);
                ctx.strokeStyle = 'var(--chart-grid)';
                ctx.lineWidth = 1;
                for (let i = 0; i <= 4; i++) {
                    const y = padding + (h - 2 * padding) * i / 4;
                    ctx.beginPath();
                    ctx.moveTo(padding, y);
                    ctx.lineTo(w - padding, y);
                    ctx.stroke();
                }
                if (scores.length > 1) {
                    ctx.strokeStyle = 'var(--chart-line)';
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    scores.forEach((score, i) => {
                        const x = padding + (w - 2 * padding) * i / (scores.length - 1);
                        const y = padding + (h - 2 * padding) * (1 - score / maxScore);
                        if (i === 0) ctx.moveTo(x, y);
                        else ctx.lineTo(x, y);
                    });
                    ctx.stroke();
                    scores.forEach((score, i) => {
                        const x = padding + (w - 2 * padding) * i / (scores.length - 1);
                        const y = padding + (h - 2 * padding) * (1 - score / maxScore);
                        ctx.fillStyle = 'var(--accent)';
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            },
            showAddTest() {
                const overlay = ModalManager.open(`
                        <div class="form-group"><label>Test Name</label><input id="tName" placeholder="e.g. JEE Main Mock 1"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                            <div class="form-group"><label>Date</label><input type="date" id="tDate" value="${new Date().toISOString().split('T')[0]}"></div>
                            <div class="form-group"><label>Type</label><select id="tType">
                                <option>JEE Main Mock</option><option>JEE Advanced Mock</option><option>Coaching Test</option>
                                <option>Chapter Test</option><option>Part Test</option><option>Custom Test</option>
                            </select></div>
                        </div>
                        <div class="form-group"><label>Maximum Marks</label><input type="number" id="tMax" value="300"></div>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                            <div class="form-group"><label>Physics Score</label><input type="number" id="tPhysics" value="0"></div>
                            <div class="form-group"><label>Chemistry Score</label><input type="number" id="tChemistry" value="0"></div>
                            <div class="form-group"><label>Maths Score</label><input type="number" id="tMaths" value="0"></div>
                        </div>
                        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
                            <div class="form-group"><label>Correct</label><input type="number" id="tCorrect" value="0"></div>
                            <div class="form-group"><label>Incorrect</label><input type="number" id="tIncorrect" value="0"></div>
                            <div class="form-group"><label>Unattempted</label><input type="number" id="tUnattempted" value="0"></div>
                        </div>
                        <div class="form-group"><label>Time Taken (minutes)</label><input type="number" id="tTime" value="180"></div>
                        <div class="modal-actions">
                            <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
                            <button class="btn-primary" onclick="TestsView.saveTest(this)">Save Test</button>
                        </div>
                    `, 'Add Test');
            },
            saveTest(btn) {
                const overlay = btn.closest('.modal-overlay');
                const get = (id) => overlay.querySelector('#' + id)?.value || '';
                const test = { id: Date.now().toString(), userId: appState.currentUser.id, name: get('tName') || 'Untitled Test', date: get('tDate') || new Date().toISOString().split('T')[0], type: get(
                        'tType') || 'Custom Test', maxMarks: parseInt(get('tMax')) || 300, physicsScore: parseInt(get(
                        'tPhysics')) || 0, chemistryScore: parseInt(get('tChemistry')) || 0, mathsScore: parseInt(get(
                        'tMaths')) || 0, correct: parseInt(get('tCorrect')) || 0, incorrect: parseInt(get(
                        'tIncorrect')) || 0, unattempted: parseInt(get('tUnattempted')) || 0, timeTaken: parseInt(get(
                        'tTime')) || 0, createdAt: new Date().toISOString() };
                appState.tests.push(test);
                StorageManager.set('tests', appState.tests);
                XPManager.addXP(XPManager.XP_RULES.test, `Test: ${test.name}`);
                overlay.remove();
                this.render();
                ToastManager.show('Test saved!');
            },
            analyzeTest(id) {
                const t = appState.tests.find(x => x.id === id);
                if (!t) return;
                const totalScore = (t.physicsScore || 0) + (t.chemistryScore || 0) + (t.mathsScore || 0);
                const maxMarks = t.maxMarks || 300;
                const percent = Math.round((totalScore / maxMarks) * 100);
                const totalAttempted = (t.correct || 0) + (t.incorrect || 0);
                const accuracy = totalAttempted > 0 ? Math.round((t.correct / totalAttempted) * 100) : 0;
                const attemptRate = maxMarks > 0 ? Math.round((totalAttempted / (maxMarks / 4)) * 100) : 0;
                const percentiles = this.estimatePercentile(percent);
                const subjects = [{ name: 'Physics', score: t.physicsScore || 0, max: maxMarks / 3 },
                { name: 'Chemistry', score: t.chemistryScore || 0, max: maxMarks / 3 }, { name: 'Mathematics',
                    score: t.mathsScore || 0, max: maxMarks / 3 }];
                const strongest = [...subjects].sort((a, b) => (b.score / b.max) - (a.score / a.max))[0];
                const weakest = [...subjects].sort((a, b) => (a.score / a.max) - (b.score / b.max))[0];
                const overlay = ModalManager.open(`
                        <div style="font-size:14px;">
                            <h3>${t.name}</h3>
                            <p class="text-secondary">${t.type} · ${new Date(t.date).toLocaleDateString()}</p>
                            <div class="divider"></div>
                            <p><strong>Total Score:</strong> ${totalScore} / ${maxMarks} (${percent}%)</p>
                            <p><strong>Accuracy:</strong> ${accuracy}%</p>
                            <p><strong>Attempt Rate:</strong> ${attemptRate}%</p>
                            <div class="divider"></div>
                            <p><strong>Subject-wise:</strong></p>
                            ${subjects.map(s => `<p>${s.name}: ${s.score}/${Math.round(s.max)} (${Math.round((s.score/s.max)*100)}%)</p>`).join('')}
                            <p><strong>Strongest:</strong> ${strongest.name} (${Math.round((strongest.score/strongest.max)*100)}%)</p>
                            <p><strong>Weakest:</strong> ${weakest.name} (${Math.round((weakest.score/weakest.max)*100)}%)</p>
                            <div class="divider"></div>
                            <p><strong>Estimated JEE Main Percentile:</strong> ${percentiles.low} – ${percentiles.high}</p>
                            <p class="text-secondary" style="font-size:11px;">Actual percentile depends on shift difficulty, normalisation and candidate performance. This is an estimate only.</p>
                        </div>
                        <div class="modal-actions">
                            <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">Close</button>
                            <button class="btn-primary" onclick="TestsView.analyzedXP('${t.id}');this.closest('.modal-overlay').remove();">Log Analysis (+30 XP)</button>
                        </div>
                    `, 'Test Analysis');
            },
            analyzedXP(testId) { XPManager.addXP(XPManager.XP_RULES.testAnalysis, 'Test Analysis');
                ToastManager.show('Analysis logged!'); },
            estimatePercentile(percent) { let low = 50,
                    high = 60; if (percent >= 90) { low = 99;
                    high = 99.9; } else if (percent >= 80) { low = 98;
                    high = 99; } else if (percent >= 70) { low = 96;
                    high = 98; } else if (percent >= 60) { low = 92;
                    high = 96; } else if (percent >= 50) { low = 85;
                    high = 92; } else if (percent >= 40) { low = 75;
                    high = 85; } else if (percent >= 30) { low = 60;
                    high = 75; } else { low = 40;
                    high = 60; } return { low, high }; }
        };

                    `;

            },
            drawSubjectChart(subjects) {
                const canvas = document.getElementById('subjectChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.parentElement.clientWidth || 600;
                const h = 200;
                canvas.width = w;
                canvas.height = h;
                const padding = 40;
                const barWidth = (w - 2 * padding) / subjects.length - 8;
                subjects.forEach((s, i) => {
                    const x = padding + i * ((w - 2 * padding) / subjects.length);
                    const barHeight = (h - 2 * padding) * (s.progress / 100);
                    const y = h - padding - barHeight;
                    ctx.fillStyle = 'var(--accent)';
                    ctx.fillRect(x + 4, y, barWidth, barHeight);
                    ctx.fillStyle = 'var(--text-secondary)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(s.progress + '%', x + 4 + barWidth / 2, y - 4);
                    ctx.fillText(s.name, x + 4 + barWidth / 2, h - padding + 14);
                });
            },
            drawErrorChart(stats) {
                const canvas = document.getElementById('errorChart');
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const w = canvas.parentElement.clientWidth || 600;
                const h = 200;
                canvas.width = w;
                canvas.height = h;
                const subjects = Object.keys(stats);
                const values = Object.values(stats);
                const maxVal = Math.max(...values, 1);
                const padding = 40;
                const barWidth = (w - 2 * padding) / subjects.length - 8;
                subjects.forEach((s, i) => {
                    const x = padding + i * ((w - 2 * padding) / subjects.length);
                    const barHeight = (h - 2 * padding) * (values[i] / maxVal);
                    const y = h - padding - barHeight;
                    ctx.fillStyle = i === 0 ? '#e85d3a' : i === 1 ? '#d4a017' : '#4a9ad8';
                    ctx.fillRect(x + 4, y, barWidth, barHeight);
                    ctx.fillStyle = 'var(--text)';
                    ctx.font = '10px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(values[i], x + 4 + barWidth / 2, y - 4);
                    ctx.fillText(s, x + 4 + barWidth / 2, h - padding + 14);
                });
            }
        };

        function previewProfilePic(input) {
            const file = input.files[0];
            const preview = document.getElementById('pmPicPreview');
            if (!file) { preview.innerHTML = ''; return; }
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.innerHTML =
                    `<img src="${e.target.result}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;">`;
                preview.dataset.imageData = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveProfileModal(btn) {
            const user = appState.currentUser;

            const overlay = btn.closest('.modal-overlay');
            const get = (id) => overlay.querySelector('#' + id)?.value || '';
            user.fullName = get('pmFullName') || user.fullName;
            user.displayName = get('pmDisplayName') || user.displayName;
            user.age = parseInt(get('pmAge')) || user.age;

            user.batch = get('pmBatch') || user.batch;
            user.targetExam = get('pmTargetExam') || user.targetExam;
            user.targetPercentile = parseFloat(get('pmPercentile')) || user.targetPercentile;
            user.targetRank = parseInt(get('pmRank')) || user.targetRank;
            user.dailyTargetHours = parseFloat(get('pmDailyTarget')) || user.dailyTargetHours;
            user.strongestSubject = get('pmStrongest') || user.strongestSubject;
            user.weakestSubject = get('pmWeakest') || user.weakestSubject;
            const picPreview = document.getElementById('pmPicPreview');
            if (picPreview?.dataset?.imageData) { user.profilePic = picPreview.dataset.imageData; }

            const email = document.getElementById('loginEmail')?.value || '';

            if (AuthManager.login(email, password)) {
                document.getElementById('authModal').classList.add('hidden');
                document.getElementById('landingScreen').classList.add('hidden');
                document.getElementById('appLayout').classList.add('active');
                ViewManager.switchView('dashboard');

                    'signupEmail'), password: get('signupPassword'), age: parseInt(get('signupAge')) || 16,

        // AUTH MANAGER

        const AuthManager = {
            signup(data) {
                if (appState.users.find(u => u.email === data.email)) { ToastManager.show(
                        'Email already registered. Please login.'); return false; }
                const newUser = { id: Date.now().toString(), fullName: data.fullName, displayName: data.displayName ||
                        data.fullName, email: data.email, password: btoa(data.password), profilePic: data
                        .profilePic || null, currentClass: data.currentClass || 'Class 11', institute: data
                        .institute || 'Self Study', instituteName: data.instituteName || '', batch: data.batch ||
                        'Self Study', targetExam: data.targetExam || 'JEE Main + Advanced 2027', targetYear: data
                        .targetYear || '2027', category: data.category || 'General', targetPercentile: data
                        .targetPercentile || 99, targetRank: data.targetRank || 1000, targetAdvRank: data
                        .targetAdvRank || 5000, dailyTargetHours: data.dailyTargetHours || 8, preferredHours: data
                        .preferredHours || 'Morning', strongestSubject: data.strongestSubject || 'Mathematics',
                    weakestSubject: data.weakestSubject || 'Physics', age: data.age || 16, createdAt: new Date()
                        .toISOString() };
                appState.users.push(newUser);
                StorageManager.set('users', appState.users);
                appState.currentUser = newUser;
                StorageManager.set('currentUser', newUser);
                this.initializeUserData(newUser.id);
                ToastManager.show('Account created! Welcome to JEEForge 🔥');
                return true;
            },
            login(email, password) {
                const user = appState.users.find(u => u.email === email && u.password === btoa(password));
                if (user) {
                    appState.currentUser = user;
                    StorageManager.set('currentUser', user);
                    this.loadUserData(user.id);
                    ToastManager.show(`Welcome back, ${user.displayName}! 🔥`);
                    return true;
                }
                return false;
            },
            logout() {
                if (appState.currentUser) { this.saveUserData(appState.currentUser.id); }
                appState.currentUser = null;
                StorageManager.remove('currentUser');
                document.getElementById('appLayout').classList.remove('active');
                document.getElementById('landingScreen').classList.remove('hidden');
                ToastManager.show('Logged out successfully.');
            },
            initializeUserData(userId) {
                if (!appState.userProgress[userId]) { appState.userProgress[userId] = { subtopics: {},
                        chapterStatus: {}, xp: 0, level: 1, totalQuestions: 0, studyHours: 0 }; }
                if (!appState.levelCycle.cycleHistory) appState.levelCycle.cycleHistory = [];
                appState.levelCycle = { day: 1, xp: 0, level: 1, cycleHistory: [], startDate: new Date().toISOString() };
                if (!appState.fastTrack) { appState.fastTrack = { activeMode: null, oneShot: { chapters: {} },
                        restartBatch: { chapters: {} } }; }
                if (!appState.testSeries) { appState.testSeries = { testResults: {}, attemptedTests: [] }; }
                if (!appState.eventPlanner) { appState.eventPlanner = { events: [], media: {}, settings: {
                            reminders: true, notifications: true } }; }
                StorageManager.set('userProgress', appState.userProgress);
                StorageManager.set('levelCycle', appState.levelCycle);
                StorageManager.set('tasks', appState.tasks);
                StorageManager.set('tests', appState.tests);
                StorageManager.set('errorFolders', appState.errorFolders);
                StorageManager.set('errorQuestions', appState.errorQuestions);
                StorageManager.set('advancedProblems', appState.advancedProblems);
                StorageManager.set('xpTransactions', appState.xpTransactions);
                StorageManager.set('studySessions', appState.studySessions);
                StorageManager.set('streakData', appState.streakData);
                StorageManager.set('fastTrack', appState.fastTrack);
                StorageManager.set('testSeries', appState.testSeries);
                StorageManager.set('jfevent_events', appState.eventPlanner);
            },
            loadUserData(userId) {
                appState.userProgress = StorageManager.get('userProgress', {});
                appState.tasks = StorageManager.get('tasks', []);
                appState.tests = StorageManager.get('tests', []);
                appState.errorFolders = StorageManager.get('errorFolders', []);
                appState.errorQuestions = StorageManager.get('errorQuestions', []);
                appState.advancedProblems = StorageManager.get('advancedProblems', []);
                appState.xpTransactions = StorageManager.get('xpTransactions', []);
                appState.studySessions = StorageManager.get('studySessions', []);
                appState.streakData = StorageManager.get('streakData', { currentStreak: 0, longestStreak: 0,
                    lastActive: null, history: [] });
                appState.levelCycle = StorageManager.get('levelCycle', { day: 1, xp: 0, level: 1, cycleHistory: [],
                    startDate: new Date().toISOString() });
                appState.fastTrack = StorageManager.get('fastTrack', { activeMode: null, oneShot: { chapters: {} },
                    restartBatch: { chapters: {} } });
                appState.testSeries = StorageManager.get('testSeries', { testResults: {}, attemptedTests: [] });
                appState.eventPlanner = StorageManager.get('jfevent_events', { events: [], media: {},
                    settings: { reminders: true, notifications: true } });
                appState.theme = StorageManager.get('theme', 'light');
                if (!appState.userProgress[userId]) { appState.userProgress[userId] = { subtopics: {},
                        chapterStatus: {}, xp: 0, level: 1, totalQuestions: 0, studyHours: 0 }; }
                if (!appState.levelCycle.cycleHistory) appState.levelCycle.cycleHistory = [];
                if (!appState.levelCycle.startDate) appState.levelCycle.startDate = new Date().toISOString();
                if (!appState.fastTrack.oneShot) appState.fastTrack.oneShot = { chapters: {} };
                if (!appState.fastTrack.restartBatch) appState.fastTrack.restartBatch = { chapters: {} };
                if (!appState.testSeries.testResults) appState.testSeries.testResults = {};
                if (!appState.testSeries.attemptedTests) appState.testSeries.attemptedTests = [];
                if (!appState.eventPlanner.events) appState.eventPlanner.events = [];
                if (!appState.eventPlanner.media) appState.eventPlanner.media = {};
                if (!appState.eventPlanner.settings) appState.eventPlanner.settings = { reminders: true,
                        notifications: true };
                this.applyTheme(appState.theme);
            },
            saveUserData(userId) {
                StorageManager.set('userProgress', appState.userProgress);
                StorageManager.set('tasks', appState.tasks);
                StorageManager.set('tests', appState.tests);
                StorageManager.set('errorFolders', appState.errorFolders);
                StorageManager.set('errorQuestions', appState.errorQuestions);
                StorageManager.set('advancedProblems', appState.advancedProblems);
                StorageManager.set('xpTransactions', appState.xpTransactions);
                StorageManager.set('studySessions', appState.studySessions);
                StorageManager.set('streakData', appState.streakData);
                StorageManager.set('levelCycle', appState.levelCycle);
                StorageManager.set('theme', appState.theme);
                StorageManager.set('settings', appState.settings);
                StorageManager.set('fastTrack', appState.fastTrack);
                StorageManager.set('testSeries', appState.testSeries);
                StorageManager.set('jfevent_events', appState.eventPlanner);
            },
            applyTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                appState.theme = theme;
                appState.settings.theme = theme;
                StorageManager.set('theme', theme);
                StorageManager.set('settings', appState.settings);
            },
            checkSession() {
                const savedUser = StorageManager.get('currentUser', null);
                if (savedUser) { appState.currentUser = savedUser;
                    this.loadUserData(savedUser.id); return true; }
                return false;
            }
        };

            _getCountdown(dateStr) {
                const target = new Date(dateStr);
                target.setHours(9, 0, 0, 0);
                const now = new Date();
                const diff = target.getTime() - now.getTime();
                if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, total: 0 };
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                return { days, hours, minutes, seconds, total: diff };
            },

            attemptTest(testId) {
                let test = RTS_TESTS.find(t => t.id === testId);
                if (!test) { ToastManager.show('Test not found.'); return; }
                const uid = appState.currentUser?.id;
                if (!uid) { ToastManager.show('Please log in to attempt tests.'); return; }
                if (!appState.testSeries.attemptedTests) appState.testSeries.attemptedTests = [];
                if (!appState.testSeries.attemptedTests.includes(testId)) {
                    appState.testSeries.attemptedTests.push(testId);
                    StorageManager.set('testSeries', appState.testSeries);

            saveAttempt(testId, btn) {

                const result = {

                const totalAttempted = (result.correct || 0) + (result.incorrect || 0);
                const accuracy = totalAttempted > 0 ? Math.round((result.correct / totalAttempted) * 100) : 0;
                const attemptRate = maxMarks > 0 ? Math.round((totalAttempted / (maxMarks / 4)) * 100) : 0;
                let low = 50,
                    high = 60;
                if (percent >= 90) { low = 99;
                    high = 99.9; } else if (percent >= 80) { low = 98;

        // ============================================================
        // ===== JFEVENT — EVENT PLANNER =====
        // ============================================================
        // (Preserved from original; only minimal changes for language)
        const JFEVENT_Storage = {
            db: null,
            async init() {
                if (this.db) return;
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('JFEVENT_DB', 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('jfevent_media')) {
                            const store = db.createObjectStore('jfevent_media', { keyPath: 'id' });
                            store.createIndex('eventId', 'eventId', { unique: false });
                        }
                    };
                    request.onsuccess = (e) => { this.db = e.target.result;
                        resolve(); };
                    request.onerror = (e) => reject(e);
                });
            },
            async saveMedia(eventId, file, type) {
                await this.init();
                const id = 'jfmed_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const dataUrl = e.target.result;
                        const entry = {
                            id,
                            eventId,
                            type,
                            name: file.name,
                            size: file.size,
                            mime: file.type,
                            data: dataUrl,
                            timestamp: Date.now()
                        };
                        const tx = this.db.transaction('jfevent_media', 'readwrite');
                        const store = tx.objectStore('jfevent_media');
                        store.put(entry);
                        tx.oncomplete = () => resolve(entry);
                        tx.onerror = (e) => reject(e);
                    };
                    reader.onerror = (e) => reject(e);
                    reader.readAsDataURL(file);
                });
            },
            async saveBlobMedia(eventId, blob, name, type, mime) {
                await this.init();
                const id = 'jfmed_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const dataUrl = e.target.result;
                        const entry = {
                            id,
                            eventId,
                            type,
                            name: name || (type === 'voice' ? 'Voice Note.wav' : 'recording.webm'),
                            size: blob.size,
                            mime: mime || 'audio/webm',
                            data: dataUrl,
                            timestamp: Date.now()
                        };
                        const tx = this.db.transaction('jfevent_media', 'readwrite');
                        const store = tx.objectStore('jfevent_media');
                        store.put(entry);
                        tx.oncomplete = () => resolve(entry);
                        tx.onerror = (e) => reject(e);
                    };
                    reader.onerror = (e) => reject(e);
                    reader.readAsDataURL(blob);
                });
            },
            async getMediaByEvent(eventId) {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('jfevent_media', 'readonly');
                    const store = tx.objectStore('jfevent_media');
                    const index = store.index('eventId');
                    const request = index.getAll(eventId);
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = (e) => reject(e);
                });
            },
            async deleteMedia(id) {
                await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('jfevent_media', 'readwrite');
                    const store = tx.objectStore('jfevent_media');
                    const request = store.delete(id);
                    request.onsuccess = () => resolve();
                    request.onerror = (e) => reject(e);
                });
            },
            async deleteMediaByEvent(eventId) {
                const items = await this.getMediaByEvent(eventId);
                for (const item of items) {
                    await this.deleteMedia(item.id);
                }
            }
        };

        const JFEVENT_EventManager = {
            getEvents() {
                const ep = appState.eventPlanner;
                if (!ep.events) ep.events = [];
                return ep.events;
            },
            saveEvents(events) {
                appState.eventPlanner.events = events;
                StorageManager.set('jfevent_events', appState.eventPlanner);
            },
            createEvent(data) {
                const events = this.getEvents();
                const event = {
                    id: 'jfevent_' + Date.now().toString(),
                    name: data.name.trim(),
                    date: data.date,
                    time: data.time || '00:00',
                    location: data.location || '',
                    category: data.category || 'Study',
                    description: data.description || '',
                    reminder: data.reminder || 'none',
                    reminderCustom: data.reminderCustom || null,
                    notes: data.notes || '',
                    status: 'upcoming',
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };
                events.push(event);
                this.saveEvents(events);
                if (event.reminder !== 'none') {
                    JFEVENT_Reminder.scheduleReminder(event);
                }
                ToastManager.show(JEEFORGE_t('toast_event_created') + ': ' + event.name);
                return event;
            },
            updateEvent(id, data) {
                const events = this.getEvents();
                const idx = events.findIndex(e => e.id === id);
                if (idx === -1) return null;
                const event = events[idx];
                const oldReminder = event.reminder;
                Object.assign(event, {
                    name: data.name !== undefined ? data.name.trim() : event.name,
                    date: data.date !== undefined ? data.date : event.date,
                    time: data.time !== undefined ? data.time : event.time,
                    location: data.location !== undefined ? data.location : event.location,
                    category: data.category !== undefined ? data.category : event.category,
                    description: data.description !== undefined ? data.description : event.description,
                    reminder: data.reminder !== undefined ? data.reminder : event.reminder,
                    reminderCustom: data.reminderCustom !== undefined ? data.reminderCustom : event.reminderCustom,
                    notes: data.notes !== undefined ? data.notes : event.notes,
                    status: data.status !== undefined ? data.status : event.status,
                    updatedAt: new Date().toISOString()
                });
                this.saveEvents(events);
                if (data.reminder !== undefined && data.reminder !== oldReminder) {
                    JFEVENT_Reminder.cancelReminder(event.id);
                    if (event.reminder !== 'none') {
                        JFEVENT_Reminder.scheduleReminder(event);
                    }
                }
                ToastManager.show(JEEFORGE_t('toast_event_updated') + ': ' + event.name);
                return event;
            },
            deleteEvent(id) {
                const events = this.getEvents();
                const idx = events.findIndex(e => e.id === id);
                if (idx === -1) return;
                const event = events[idx];
                JFEVENT_Reminder.cancelReminder(id);
                JFEVENT_Storage.deleteMediaByEvent(id).catch(() => {});
                events.splice(idx, 1);
                this.saveEvents(events);
                ToastManager.show(JEEFORGE_t('toast_event_deleted') + ': ' + event.name);
            },
            getEvent(id) {
                return this.getEvents().find(e => e.id === id) || null;
            },
            getUpcomingEvents() {
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return this.getEvents().filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d >= now && e.status !== 'cancelled' && e.status !== 'completed';
                }).sort((a, b) => new Date(a.date) - new Date(b.date) || a.time.localeCompare(b.time));
            },
            getPastEvents() {
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                return this.getEvents().filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d < now || e.status === 'completed' || e.status === 'cancelled';
                }).sort((a, b) => new Date(b.date) - new Date(a.date) || b.time.localeCompare(a.time));
            },
            getTodayEvents() {
                const today = new Date().toISOString().split('T')[0];
                return this.getEvents().filter(e => e.date === today && e.status !== 'cancelled');
            },
            getEventsByDate(date) {
                return this.getEvents().filter(e => e.date === date && e.status !== 'cancelled');
            },
            getStatistics() {
                const events = this.getEvents();
                const total = events.length;
                const now = new Date();
                now.setHours(0, 0, 0, 0);
                const todayStr = now.toISOString().split('T')[0];
                const upcoming = events.filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d >= now && e.status !== 'cancelled' && e.status !== 'completed';
                }).length;
                const today = events.filter(e => e.date === todayStr && e.status !== 'cancelled').length;
                const completed = events.filter(e => e.status === 'completed').length;
                const cancelled = events.filter(e => e.status === 'cancelled').length;
                const weekStart = new Date(now);
                weekStart.setDate(weekStart.getDate() - weekStart.getDay());
                const thisWeek = events.filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d >= weekStart && e.status !== 'cancelled' && e.status !== 'completed';
                }).length;
                const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
                const thisMonth = events.filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d >= monthStart && e.status !== 'cancelled' && e.status !== 'completed';
                }).length;
                const completedThisMonth = events.filter(e => {
                    const d = new Date(e.date);
                    d.setHours(0, 0, 0, 0);
                    return d >= monthStart && e.status === 'completed';
                }).length;
                return { total, upcoming, today, completed, cancelled, thisWeek, thisMonth, completedThisMonth };
            },
            markCompleted(id) {
                const event = this.getEvent(id);
                if (!event) return;
                this.updateEvent(id, { status: 'completed' });
                ToastManager.show('✅ ' + JEEFORGE_t('status_completed') + ': ' + event.name);
            },
            markCancelled(id) {
                const event = this.getEvent(id);
                if (!event) return;
                this.updateEvent(id, { status: 'cancelled' });
                ToastManager.show('❌ ' + JEEFORGE_t('status_cancelled') + ': ' + event.name);
            },
            getEventStatus(event) {
                const now = new Date();
                const todayStr = now.toISOString().split('T')[0];
                if (event.status === 'completed') return 'completed';
                if (event.status === 'cancelled') return 'cancelled';
                if (event.date === todayStr) return 'today';
                const d = new Date(event.date);
                d.setHours(0, 0, 0, 0);
                now.setHours(0, 0, 0, 0);
                if (d < now) return 'past';
                return 'upcoming';
            },
            getCountdown(event) {
                const now = new Date();
                const target = new Date(event.date + 'T' + (event.time || '00:00'));
                const diff = target.getTime() - now.getTime();
                if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, total: 0 };
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                return { days, hours, minutes, seconds, total: diff };
            },
            searchEvents(query) {
                const q = query.toLowerCase().trim();
                if (!q) return this.getEvents();
                return this.getEvents().filter(e =>
                    e.name.toLowerCase().includes(q) ||
                    (e.description && e.description.toLowerCase().includes(q)) ||
                    (e.notes && e.notes.toLowerCase().includes(q)) ||
                    e.category.toLowerCase().includes(q)
                );
            },
            filterEvents(events, filter) {
                if (filter === 'all') return events;
                if (filter === 'upcoming') {
                    const now = new Date();
                    now.setHours(0, 0, 0, 0);
                    return events.filter(e => {
                        const d = new Date(e.date);
                        d.setHours(0, 0, 0, 0);
                        return d >= now && e.status !== 'cancelled' && e.status !== 'completed';
                    });
                }
                if (filter === 'today') {
                    const today = new Date().toISOString().split('T')[0];
                    return events.filter(e => e.date === today && e.status !== 'cancelled');
                }
                if (filter === 'completed') {
                    return events.filter(e => e.status === 'completed');
                }
                if (filter === 'cancelled') {
                    return events.filter(e => e.status === 'cancelled');
                }
                return events.filter(e => e.category === filter);
            }
        };

        const JFEVENT_Reminder = {
            reminders: [],
            checkInterval: null,
            init() {
                const stored = StorageManager.get('jfevent_reminders', []);
                this.reminders = stored;
                if (this.checkInterval) clearInterval(this.checkInterval);
                this.checkInterval = setInterval(() => this.checkReminders(), 30000);
                this.checkReminders();
                if ('Notification' in window && Notification.permission === 'default') {
                    Notification.requestPermission().catch(() => {});
                }
            },
            scheduleReminder(event) {
                const reminderTime = this.getReminderTime(event);
                if (!reminderTime) return;
                this.cancelReminder(event.id);
                const reminder = {
                    eventId: event.id,
                    eventName: event.name,
                    eventDate: event.date,
                    eventTime: event.time,
                    triggerAt: reminderTime.toISOString(),
                    notified: false
                };
                this.reminders.push(reminder);
                this.saveReminders();
            },
            cancelReminder(eventId) {
                this.reminders = this.reminders.filter(r => r.eventId !== eventId);
                this.saveReminders();
            },
            getReminderTime(event) {
                const target = new Date(event.date + 'T' + (event.time || '00:00'));
                const rem = event.reminder || 'none';
                let offset = 0;
                switch (rem) {
                    case 'none':
                        return null;
                    case '5min':
                        offset = 5;
                        break;
                    case '15min':
                        offset = 15;
                        break;
                    case '30min':
                        offset = 30;
                        break;
                    case '1hour':
                        offset = 60;
                        break;
                    case '2hours':
                        offset = 120;
                        break;
                    case '1day':
                        offset = 1440;
                        break;
                    case 'custom':
                        if (event.reminderCustom) {
                            const custom = new Date(event.reminderCustom);
                            if (!isNaN(custom.getTime())) return custom;
                        }
                        return null;
                    default:
                        return null;
                }
                const trigger = new Date(target.getTime() - offset * 60000);
                return trigger;
            },
            checkReminders() {
                const now = new Date();
                for (const r of this.reminders) {
                    if (r.notified) continue;
                    const trigger = new Date(r.triggerAt);
                    if (trigger <= now) {
                        this.triggerReminder(r);
                    }
                }
            },
            triggerReminder(reminder) {
                reminder.notified = true;
                this.saveReminders();
                ToastManager.show('🔔 ' + reminder.eventName + ' is coming up!', 'info');
                try {
                    if ('Notification' in window && Notification.permission === 'granted') {
                        new Notification('🔔 JEEForge Reminder', {
                            body: `${reminder.eventName} — ${new Date(reminder.eventDate).toLocaleDateString()} at ${reminder.eventTime}`,
                            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🔥</text></svg>'
                        });
                    }
                } catch (e) {}
                if (ViewManager.currentView === 'eventplanner') {
                    JFEVENT_View.render();
                }
            },
            saveReminders() {
                StorageManager.set('jfevent_reminders', this.reminders);
            },
            clearAll() {
                this.reminders = [];
                this.saveReminders();
            }
        };
