            --text-secondary: #60b0a0;

            --accent-soft: rgba(0, 255, 204, 0.15);
            --border: #1a2a2a;

            --progress-fill: #00ffcc;
            --success: #00cc88;
            --warning: #ffcc00;
            --danger: #ff3366;

            --shadow: rgba(0, 0, 0, 0.6);
            --chart-line: #00ffcc;

        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            overflow-x: hidden;
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar);
            border-radius: 3px;
        }
        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            outline: none;
            transition: all 0.2s ease;
        }
        input,
        select,
        textarea {
            font-family: inherit;
            outline: none;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 14px;
            transition: border 0.2s, box-shadow 0.2s;
        }
        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        textarea {
            resize: vertical;
            min-height: 60px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .phoenix-logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 48px;
            height: 48px;
            flex-shrink: 0;
        }
        .phoenix-logo svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 6px var(--accent-glow));
            animation: phoenixGlow 3s ease-in-out infinite;
        }
        @keyframes phoenixGlow {
            0%,
            100% {
                filter: drop-shadow(0 0 4px var(--accent-glow));
            }
            50% {
                filter: drop-shadow(0 0 12px var(--accent-glow));
            }
        }
        #landingScreen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            background: var(--bg);
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        #landingScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .landing-content {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .landing-logo {
            font-size: 72px;
            margin-bottom: 20px;
            animation: floatPhoenix 3s ease-in-out infinite;
        }
        @keyframes floatPhoenix {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .landing-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .landing-tagline {
            font-size: 18px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .landing-sub {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 30px;
        }
        .landing-buttons {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 16px var(--accent-soft);
        }
        .btn-primary:hover {
            background: var(--accent-glow);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-soft);
        }
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            border: 2px solid var(--border);
        }
        .btn-secondary:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .btn-danger {
            background: var(--danger);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-danger:hover {
            filter: brightness(1.1);
        }
        .btn-sm {
            padding: 7px 14px;
            font-size: 12px;
            border-radius: 6px;
            font-weight: 600;
        }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .auth-modal {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            background: var(--overlay);
            backdrop-filter: blur(4px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .auth-box {
            background: var(--modal-bg);
            border-radius: 16px;
            padding: 32px;
            width: 92%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px var(--shadow);
            animation: slideUp 0.35s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .auth-box h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .auth-box .auth-sub {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 24px;
        }
        .auth-box .form-group {
            margin-bottom: 16px;
        }
        .auth-box label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-secondary);
        }
        .auth-box input,
        .auth-box select {
            width: 100%;
        }
        .auth-box .auth-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .auth-box .auth-link {
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            text-decoration: underline;
            background: none;
            padding: 0;
        }
        .auth-box .auth-link:hover {
            color: var(--accent-glow);
        }
        #appLayout {
            display: none;
            min-height: 100vh;
        }
        #appLayout.active {
            display: flex;
        }
        .sidebar {
            width: 250px;
            background: var(--sidebar);
            color: var(--sidebar-text);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }
        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 20px 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header .brand-name {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }
        .sidebar-nav {
            flex: 1;
            padding: 16px 0;
            overflow-y: auto;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 20px;
            cursor: pointer;
            color: var(--sidebar-text);
            font-size: 13px;
            font-weight: 500;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav .nav-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-left-color: var(--accent);
        }
        .sidebar-nav .nav-item.active {
            background: var(--nav-active);
            border-left-color: var(--accent);
            color: var(--accent-glow);
        }
        .sidebar-nav .nav-item .nav-icon {
            font-size: 18px;
            width: 24px;
            text-align: center;
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            font-size: 11px;
            color: var(--text-secondary);
        }
        .main-content {
            flex: 1;
            margin-left: 250px;
            padding: 24px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .top-bar h1 {
            font-size: 24px;
            font-weight: 700;
        }
        .top-bar .top-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .hamburger {
            display: none;
            background: var(--card);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 20px;
            border: 1px solid var(--border);
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow);
            transition: all 0.25s ease;
        }
        .card:hover {
            box-shadow: 0 6px 20px var(--shadow);
            transform: translateY(-2px);
        }
        .card h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .card .card-value {
            font-size: 28px;
            font-weight: 800;
        }
        .card .card-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        .card .card-icon {
            font-size: 28px;
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 4px;
            overflow: hidden;
            margin: 6px 0;
        }
        .progress-bar .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--progress-fill);
            transition: width 0.6s ease;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .view {
            display: none;
        }
        .view.active {
            display: block;
            animation: viewFade 0.3s ease;

            flex-wrap: wrap;
            gap: 8px;
        }
        .text-secondary {
            color: var(--text-secondary);
        }
        .text-accent {
            color: var(--accent);
        }
        .gap-8 {
            gap: 8px;
        }
        .mt-16 {
            margin-top: 16px;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .hidden {
            display: none !important;
        }
        .countdown-text {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent);
        }
        .xp-bar {
            height: 6px;
            background: var(--progress-bg);
            border-radius: 3px;
            overflow: hidden;
            margin: 4px 0;
        }
        .xp-bar .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--xp-gold), var(--accent));
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .onboarding-step {
            animation: viewFade 0.4s ease;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--overlay);
            z-index: 99;
        }
        @media (max-width: 1024px) {
            .sidebar-overlay.active {
                display: block;
            }
        }

        /* ============================================================
           JFEVENT — EVENT PLANNER STYLES (isolated)
           ============================================================ */
        .jfevent-dashboard {
            padding: 4px 0;
        }
        .jfevent-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        .jfevent-stat-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s;
        }
        .jfevent-stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow);
        }
        .jfevent-stat-card .jfevent-stat-num {
            font-size: 28px;
            font-weight: 800;
        }
        .jfevent-stat-card .jfevent-stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .jfevent-stat-card .jfevent-stat-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .jfevent-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
            align-items: center;
        }
        .jfevent-toolbar .jfevent-search-input {
            flex: 1;
            min-width: 180px;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 13px;
        }
        .jfevent-toolbar .jfevent-search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }
        .jfevent-filter-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .jfevent-filter-btn {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: var(--tag-bg);
            color: var(--text-secondary);
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .jfevent-filter-btn:hover {
            border-color: var(--accent-soft);
        }
        .jfevent-filter-btn.jfevent-active-filter {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: var(--accent);
        }

        .jfevent-event-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            margin-top: 12px;
        }
        .jfevent-event-card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow);
            transition: all 0.25s ease;
            position: relative;
        }
        .jfevent-event-card:hover {
            box-shadow: 0 6px 24px var(--shadow);
            transform: translateY(-3px);
        }
        .jfevent-event-card .jfevent-event-name {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .jfevent-event-card .jfevent-event-meta {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 4px 0 8px;
        }
        .jfevent-event-card .jfevent-event-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .jfevent-event-card .jfevent-event-status {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
        }
        .jfevent-status-upcoming {
            background: rgba(74, 154, 216, 0.2);
            color: var(--fasttrack-blue);
        }
        .jfevent-status-today {
            background: rgba(232, 93, 58, 0.2);
            color: var(--accent);
        }
        .jfevent-status-completed {
            background: rgba(76, 175, 109, 0.2);
            color: var(--fasttrack-green);
        }
        .jfevent-status-cancelled {
            background: rgba(192, 57, 43, 0.15);
            color: var(--danger);
        }
        .jfevent-event-card .jfevent-countdown {
            font-size: 14px;
            font-weight: 700;
            margin: 6px 0 10px;
            color: var(--accent);
        }
        .jfevent-event-card .jfevent-event-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .jfevent-event-card .jfevent-event-actions button {
            font-size: 12px;
            font-weight: 600;
            padding: 5px 14px;
            border-radius: 6px;
        }
        .jfevent-event-card .jfevent-event-category {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--tag-bg);
            color: var(--text-secondary);
        }
        .jfevent-event-card .jfevent-media-preview {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .jfevent-event-card .jfevent-media-preview .jfevent-media-thumb {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .jfevent-event-card .jfevent-media-preview .jfevent-media-icon {
            width: 44px;
            height: 44px;
            border-radius: 6px;
            background: var(--tag-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border: 1px solid var(--border);
        }

        .jfevent-calendar-wrap {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 10px var(--shadow);
            margin-top: 16px;
        }
        .jfevent-calendar-wrap .jfevent-cal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 14px;
        }
        .jfevent-calendar-wrap .jfevent-cal-header h3 {
            font-size: 20px;
            font-weight: 700;
            margin: 0;
        }
        .jfevent-calendar-wrap .jfevent-cal-header .jfevent-cal-nav {
            display: flex;
            gap: 6px;
        }
        .jfevent-calendar-wrap .jfevent-cal-header .jfevent-cal-nav button {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            background: var(--tag-bg);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .jfevent-calendar-wrap .jfevent-cal-header .jfevent-cal-nav button:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
        }
        .jfevent-calendar-wrap .jfevent-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-align: center;
            padding: 6px 0;
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            background: var(--input-bg);
            color: var(--text);
            position: relative;
            min-height: 44px;
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day:hover {
            background: var(--hover);
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day.jfevent-cal-empty {
            background: transparent;
            cursor: default;
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day.jfevent-cal-today {
            background: var(--accent-soft);
            border: 2px solid var(--accent);
            color: var(--accent);
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day.jfevent-cal-has-event {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day .jfevent-cal-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 2px;
        }

        .jfevent-media-section {
            margin-top: 12px;
        }
        .jfevent-media-section .jfevent-media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 8px;
        }
        .jfevent-media-section .jfevent-media-item {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid var(--border);
            text-align: center;
            transition: all 0.2s;
            position: relative;
        }
        .jfevent-media-section .jfevent-media-item:hover {
            border-color: var(--accent-soft);
        }
        .jfevent-media-section .jfevent-media-item img,
        .jfevent-media-section .jfevent-media-item video {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 4px;
        }
        .jfevent-media-section .jfevent-media-item .jfevent-media-file-icon {
            font-size: 32px;
            padding: 12px 0;
        }
        .jfevent-media-section .jfevent-media-item .jfevent-media-name {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 4px;
            word-break: break-all;
        }
        .jfevent-media-section .jfevent-media-item .jfevent-media-del {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(192, 57, 43, 0.8);
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            border: none;
        }
        .jfevent-media-section .jfevent-media-item .jfevent-media-del:hover {
            background: var(--danger);
        }

        .jfevent-voice-recorder {
            background: var(--input-bg);
            border-radius: 10px;
            padding: 16px;
            border: 1px solid var(--border);
            margin-top: 8px;
        }
        .jfevent-voice-recorder .jfevent-recorder-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .jfevent-voice-recorder .jfevent-recorder-timer {
            font-size: 18px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            min-width: 80px;
        }
        .jfevent-voice-recorder .jfevent-recorder-status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .jfevent-notes-editor {
            margin-top: 12px;
        }
        .jfevent-notes-editor textarea {
            width: 100%;
            min-height: 80px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            padding: 10px 14px;
            font-size: 13px;
            resize: vertical;
        }
        .jfevent-notes-editor textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .jfevent-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-secondary);
        }
        .jfevent-empty .jfevent-empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .jfevent-reminder-banner {
            background: linear-gradient(135deg, var(--accent-soft), transparent);
            border: 1px solid var(--accent-soft);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .jfevent-reminder-banner .jfevent-reminder-text {
            font-size: 14px;
            font-weight: 600;
        }
        .jfevent-reminder-banner .jfevent-reminder-text .jfevent-reminder-name {
            color: var(--accent);
            font-weight: 700;
        }

        /* responsive tweaks for event planner */
        @media (max-width: 600px) {
            .jfevent-event-grid {
                grid-template-columns: 1fr;
            }
            .jfevent-stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            .jfevent-toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .jfevent-toolbar .jfevent-search-input {
                min-width: unset;
            }
            .jfevent-calendar-wrap .jfevent-cal-grid .jfevent-cal-day {
                font-size: 12px;
                min-height: 36px;
            }
        }
        @media (max-width: 400px) {
            .jfevent-stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ============================================================
           JFEORGE — PREMIUM EXAM COUNTDOWN STYLES (namespaced)
           ============================================================ */
        .jfeorge-countdown-wrap {
            background: var(--card);
            border-radius: 16px;
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px var(--shadow);
            margin-bottom: 20px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        .jfeorge-countdown-wrap::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-glow), var(--xp-gold));
            opacity: 0.7;
        }
        .jfeorge-countdown-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }
        .jfeorge-countdown-target {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .jfeorge-countdown-target .jfeorge-target-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .jfeorge-countdown-target .jfeorge-target-name {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-glow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }
        .jfeorge-countdown-target .jfeorge-target-date {
            font-size: 13px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 2px;
        }
        .jfeorge-countdown-target .jfeorge-target-date span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .jfeorge-exam-selector-wrap {
            position: relative;
        }
        .jfeorge-exam-selector-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 30px;
            background: var(--input-bg);
            border: 1.5px solid var(--border);
            color: var(--text);
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .jfeorge-exam-selector-btn:hover {
            border-color: var(--accent);
            background: var(--accent-soft);
        }
        .jfeorge-exam-selector-btn .jfeorge-arrow {
            font-size: 12px;
            transition: transform 0.25s ease;
            display: inline-block;
        }
        .jfeorge-exam-selector-btn .jfeorge-arrow.open {
            transform: rotate(180deg);
        }
        .jfeorge-exam-dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            min-width: 220px;
            background: var(--modal-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 12px 40px var(--shadow);
            padding: 8px 0;
            z-index: 50;
            display: none;
            overflow: hidden;
            animation: slideDown 0.2s ease;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .jfeorge-exam-dropdown.open {
            display: block;
        }
        .jfeorge-exam-dropdown .jfeorge-exam-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .jfeorge-exam-dropdown .jfeorge-exam-option:hover {
            background: var(--hover);
        }
        .jfeorge-exam-dropdown .jfeorge-exam-option.active-opt {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .jfeorge-exam-dropdown .jfeorge-exam-option .jfeorge-opt-icon {
            font-size: 16px;
        }
        .jfeorge-exam-dropdown .jfeorge-exam-option .jfeorge-opt-check {
            margin-left: auto;
            color: var(--accent);
            font-weight: 700;
        }
        .jfeorge-exam-dropdown .jfeorge-divider {
            height: 1px;
            background: var(--border);
            margin: 4px 12px;
        }

        /* Countdown boxes */
        .jfeorge-countdown-boxes {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 16px 0 12px;
        }
        .jfeorge-countdown-box {
            background: var(--input-bg);
            border-radius: 12px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }
        .jfeorge-countdown-box:hover {
            border-color: var(--accent-soft);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px var(--shadow);
        }
        .jfeorge-countdown-box .jfeorge-box-number {
            font-size: 38px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            line-height: 1.1;
            color: var(--text);
            transition: color 0.3s;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .jfeorge-countdown-box .jfeorge-box-number.jfeorge-number-flip {
            animation: jfeorgeFlip 0.15s ease;
        }
        @keyframes jfeorgeFlip {
            0% {
                transform: scaleY(1);
                opacity: 1;
            }
            50% {
                transform: scaleY(0.3);
                opacity: 0.5;
            }
            100% {
                transform: scaleY(1);
                opacity: 1;
            }
        }
        .jfeorge-countdown-box .jfeorge-box-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-secondary);
            opacity: 0.7;
            margin-top: 2px;
        }
        .jfeorge-countdown-box .jfeorge-box-accent {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent-glow));
            opacity: 0;
            transition: opacity 0.3s;
        }
        .jfeorge-countdown-box:hover .jfeorge-box-accent {
            opacity: 1;
        }
        /* Completed / Exam Day state */
        .jfeorge-countdown-box .jfeorge-box-completed {
            font-size: 14px;
            font-weight: 700;
            color: var(--success);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 48px;
        }
        .jfeorge-countdown-box .jfeorge-box-completed .jfeorge-check-icon {
            font-size: 24px;
        }

        /* Progress section */
        .jfeorge-progress-section {
            margin: 8px 0 4px;
        }
        .jfeorge-progress-section .jfeorge-progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .jfeorge-progress-section .jfeorge-progress-header .jfeorge-progress-label {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 11px;
        }
        .jfeorge-progress-section .jfeorge-progress-header .jfeorge-progress-pct {
            color: var(--accent);
            font-weight: 700;
        }
        .jfeorge-progress-bar {
            width: 100%;
            height: 8px;
            background: var(--progress-bg);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .jfeorge-progress-bar .jfeorge-progress-fill {
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--accent), var(--accent-glow));
            transition: width 0.8s ease;
            width: 0%;
        }

            display: flex;
            justify-content: space-between;

            color: var(--text-secondary);
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 4px;

            color: var(--text);
            font-weight: 700;
        }

            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 8px 0 2px;

            font-style: italic;

            padding-top: 12px;

            .jfeorge-countdown-boxes {

                padding: 18px 16px;

            }

                font-size: 30px;
                min-height: 38px;
            }
            .jfeorge-countdown-top {
                flex-direction: column;
                align-items: stretch;
            }
            .jfeorge-exam-selector-wrap {
                align-self: flex-start;
            }
            .jfeorge-exam-dropdown {
                right: auto;
                left: 0;
                min-width: 200px;
            }
        }
        @media (max-width: 420px) {
            .jfeorge-countdown-boxes {
                gap: 8px;
            }
            .jfeorge-countdown-box {
                padding: 10px 4px;

                padding: 14px 12px;
            }

        function applyLanguageToUI() {
            document.querySelectorAll('.jf-nav-label').forEach(el => {
                const key = el.closest('.nav-item')?.dataset?.view;
                if (key) {
                    const tKey = 'nav_' + key;
                    const translated = JEEFORGE_t(tKey);
                    if (translated !== tKey) el.textContent = translated;
                }
            });
            const viewTitle = document.getElementById('viewTitle');
            if (viewTitle) {
                const currentView = ViewManager?.currentView || 'dashboard';
                const tKey = 'nav_' + currentView;
                const translated = JEEFORGE_t(tKey);
                if (translated !== tKey) viewTitle.textContent = translated;
            }

                ViewManager.renderView(ViewManager.currentView);

        // ============ STORAGE MANAGER ============
        const StorageManager = {
            get(key, defaultVal = null) {
                try {
                    const data = localStorage.getItem('jeeforge_' + key);
                    return data ? JSON.parse(data) : defaultVal;
                } catch { return defaultVal; }
            },
            set(key, value) {
                try {
                    localStorage.setItem('jeeforge_' + key, JSON.stringify(value));
                } catch (e) { console.error('Storage error:', e); }
            },
            remove(key) {
                localStorage.removeItem('jeeforge_' + key);
            },
            clearAll() {
                const keys = Object.keys(localStorage);
                keys.filter(k => k.startsWith('jeeforge_')).forEach(k => localStorage.removeItem(k));
            },
            indexedDB: {
                db: null,
                async init() {
                    return new Promise((resolve, reject) => {
                        const request = indexedDB.open('JEEForgeDB', 1);
                        request.onupgradeneeded = (e) => {
                            const db = e.target.result;
                            if (!db.objectStoreNames.contains('images')) {
                                db.createObjectStore('images', { keyPath: 'id' });
                            }
                        };
                        request.onsuccess = (e) => { this.db = e.target.result;
                            resolve(); };
                        request.onerror = (e) => reject(e);
                    });
                },
                async saveImage(id, dataUrl) {
                    if (!this.db) await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('images', 'readwrite');
                        const store = tx.objectStore('images');
                        store.put({ id, dataUrl, timestamp: Date.now() });
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e);
                    });
                },
                async getImage(id) {
                    if (!this.db) await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('images', 'readonly');
                        const store = tx.objectStore('images');
                        const request = store.get(id);
                        request.onsuccess = () => resolve(request.result ? request.result.dataUrl : null);
                        request.onerror = (e) => reject(e);
                    });
                },
                async deleteImage(id) {
                    if (!this.db) await this.init();
                    return new Promise((resolve, reject) => {
                        const tx = this.db.transaction('images', 'readwrite');
                        const store = tx.objectStore('images');
                        store.delete(id);
                        tx.oncomplete = () => resolve();
                        tx.onerror = (e) => reject(e);
                    });
                }
            }
        };

                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                overlay.innerHTML = `
                        <div class="modal-box">
                            ${title ? `<h2>${title}</h2>` : ''}
                            ${html}
                        </div>
                    `;
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) overlay.remove();
                });
                document.body.appendChild(overlay);
                return overlay;
            },
            close(overlay) {
                if (overlay) overlay.remove();
            },
            confirm(message, onConfirm) {
                const overlay = this.open(`
                        <p style="font-size:14px;margin-bottom:16px;">${message}</p>
                        <div class="modal-actions">
                            <button class="btn-outline" onclick="this.closest('.modal-overlay').remove()">${JEEFORGE_t('cancel')}</button>
                            <button class="btn-danger" id="confirmBtn">${JEEFORGE_t('confirm')}</button>
                        </div>
                    `);
                overlay.querySelector('#confirmBtn').addEventListener('click', () => {
                    overlay.remove();
                    onConfirm();
                });
                return overlay;

                        { id: 'rb_chem_ino_02', name: 'Chemical Bonding and Molecular Structure', lectures: 4,
                            dpp: 3 },
                    ]
                }
            },
            getAllOneShotChapters() {
                const result = [];
                const subjects = ['Physics', 'Mathematics'];
                for (const subj of subjects) {
                    for (const ch of this.oneShotChapters[subj]) {
                        result.push({ ...ch, subject: subj, category: subj });
                    }
                }
                for (const cat of ['Physical', 'Organic', 'Inorganic']) {
                    for (const ch of this.oneShotChapters.Chemistry[cat]) {
                        result.push({ ...ch, subject: 'Chemistry', category: cat });

                }
                return result;
            },
            getAllRestartChapters() {
                const result = [];
                const subjects = ['Physics', 'Mathematics'];
                for (const subj of subjects) {
                    for (const ch of this.restartBatchChapters[subj]) {
                        result.push({ ...ch, subject: subj, category: subj });
                    }
                }
                for (const cat of ['Physical', 'Organic', 'Inorganic']) {
                    for (const ch of this.restartBatchChapters.Chemistry[cat]) {
                        result.push({ ...ch, subject: 'Chemistry', category: cat });
                    }

                return result;
            },
            getOneShotRecommendedDays(chapterId) {
                const all = this.getAllOneShotChapters();
                const found = all.find(c => c.id === chapterId);

        // ============================================================
        // APP STATE

        let appState = {
            currentUser: null,
            users: StorageManager.get('users', []),
            userProgress: StorageManager.get('userProgress', {}),
            tasks: StorageManager.get('tasks', []),
            tests: StorageManager.get('tests', []),
            errorFolders: StorageManager.get('errorFolders', []),
            errorQuestions: StorageManager.get('errorQuestions', []),
            advancedProblems: StorageManager.get('advancedProblems', []),
            xpTransactions: StorageManager.get('xpTransactions', []),
            studySessions: StorageManager.get('studySessions', []),
            streakData: StorageManager.get('streakData', { currentStreak: 0, longestStreak: 0, lastActive: null,
                history: [] }),
            theme: StorageManager.get('theme', 'light'),
            levelCycle: StorageManager.get('levelCycle', { day: 1, xp: 0, level: 1, cycleHistory: [], startDate: new Date()
                    .toISOString() }),
            notifications: StorageManager.get('notifications', []),
            settings: StorageManager.get('settings', { theme: 'light' }),
            onboardingComplete: StorageManager.get('onboardingComplete', false),
            fastTrack: StorageManager.get('fastTrack', {
                activeMode: null,

        // ============================================================
        // FAST-TRACK MANAGER (unchanged)
        // ============================================================
        const FastTrackManager = {
            getUserId() { return appState.currentUser?.id || null; },
            getOneShotProgress(chapterId) {
                const uid = this.getUserId();
                if (!uid) return null;
                const ft = appState.fastTrack;
                if (!ft.oneShot.chapters[chapterId]) {
                    ft.oneShot.chapters[chapterId] = { started: false, completed: false, startDate: null, finishDate: null,
                        subtopics: {} };
                    this.save();
                }
                return ft.oneShot.chapters[chapterId];
            },
            toggleOneShotSubtopic(chapterId, subtopicName) {
                const uid = this.getUserId();
                if (!uid) return;
                const prog = this.getOneShotProgress(chapterId);
                if (!prog) return;
                const key = subtopicName.trim();
                prog.subtopics[key] = !prog.subtopics[key];
                if (!prog.started) { prog.started = true;
                    prog.startDate = new Date().toISOString();
                    ToastManager.show('📘 Started: ' + chapterId.replace('os_', '').replace(/_/g, ' ')); }
                const allCh = FastTrackData.getAllOneShotChapters().find(c => c.id === chapterId);
                if (allCh) {
                    const allSubs = allCh.subtopics;
                    const allDone = allSubs.every(s => prog.subtopics[s] === true);
                    if (allDone && !prog.completed) {
                        prog.completed = true;
                        prog.finishDate = new Date().toISOString();
                        ToastManager.show('✅ Completed: ' + allCh.name);
                        XPManager.addXP(25, 'One Shot Chapter: ' + allCh.name);
                    } else if (!allDone && prog.completed) { prog.completed = false;
                        prog.finishDate = null; }
                }
                this.save();
                if (ViewManager.currentView === 'fasttrack') FastTrackView.render();
            },
            toggleOneShotStarted(chapterId) {
                const uid = this.getUserId();
                if (!uid) return;
                const prog = this.getOneShotProgress(chapterId);
                if (!prog) return;
                prog.started = !prog.started;
                if (prog.started) { prog.startDate = new Date().toISOString();
                    ToastManager.show('📘 Started: ' + chapterId.replace('os_', '').replace(/_/g, ' ')); } else { prog
                        .startDate = null;
                    prog.completed = false;
                    prog.finishDate = null; }
                this.save();
                if (ViewManager.currentView === 'fasttrack') FastTrackView.render();
            },
            toggleOneShotCompleted(chapterId) {
                const uid = this.getUserId();
                if (!uid) return;
                const prog = this.getOneShotProgress(chapterId);
                if (!prog) return;
                if (!prog.started) { ToastManager.show('Please start the chapter first.'); return; }
                prog.completed = !prog.completed;
                if (prog.completed) { prog.finishDate = new Date().toISOString();
                    ToastManager.show('✅ Completed: ' + chapterId.replace('os_', '').replace(/_/g, ' '));
                    XPManager.addXP(25, 'One Shot Chapter: ' + chapterId); } else { prog.finishDate = null; }
                this.save();
                if (ViewManager.currentView === 'fasttrack') FastTrackView.render();
            },
            getOneShotChapterStatus(chapterId) {
                const prog = this.getOneShotProgress(chapterId);
                if (!prog) return 'not-started';
                if (prog.completed) return 'completed';
                if (prog.started) return 'in-progress';
                return 'not-started';
            },
            getOneShotChapterDays(chapterId) {
                const prog = this.getOneShotProgress(chapterId);
                if (!prog || !prog.startDate) return null;
                const start = new Date(prog.startDate);
                const end = prog.finishDate ? new Date(prog.finishDate) : new Date();
                return Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
            },
            getRestartProgress(chapterId) {
                const uid = this.getUserId();
                if (!uid) return null;
                const ft = appState.fastTrack;
                if (!ft.restartBatch.chapters[chapterId]) {
                    const allCh = FastTrackData.getAllRestartChapters().find(c => c.id === chapterId);
                    ft.restartBatch.chapters[chapterId] = { lecturesCompleted: 0, dppCompleted: 0, startDate: null,
                        finishDate: null, completed: false, totalLectures: allCh ? allCh.lectures : 0, totalDPPs: allCh ?
                            allCh.dpp : 0 };
                    this.save();
                }
                return ft.restartBatch.chapters[chapterId];
            },
            updateRestartProgress(chapterId, type, increment) {
                const uid = this.getUserId();
                if (!uid) return;
                const prog = this.getRestartProgress(chapterId);
                if (!prog) return;
                const allCh = FastTrackData.getAllRestartChapters().find(c => c.id === chapterId);
                if (!allCh) return;
                if (type === 'lecture') { prog.lecturesCompleted = Math.min(allCh.lectures, Math.max(0, prog
                        .lecturesCompleted + increment)); } else if (type === 'dpp') { prog.dppCompleted = Math.min(allCh
                        .dpp, Math.max(0, prog.dppCompleted + increment)); }
                if ((prog.lecturesCompleted > 0 || prog.dppCompleted > 0) && !prog.startDate) { prog.startDate = new Date()
                        .toISOString();
                    ToastManager.show('📚 Started: ' + allCh.name); }
                const allLecturesDone = prog.lecturesCompleted >= allCh.lectures;
                const allDppsDone = prog.dppCompleted >= allCh.dpp;
                if (allLecturesDone && allDppsDone && !prog.completed) {
                    prog.completed = true;
                    prog.finishDate = new Date().toISOString();
                    ToastManager.show('✅ Completed: ' + allCh.name + ' (Restart Batch)');
                    XPManager.addXP(30, 'Restart Batch Chapter: ' + allCh.name);
                } else if ((!allLecturesDone || !allDppsDone) && prog.completed) { prog.completed = false;
                    prog.finishDate = null; }
                this.save();
                if (ViewManager.currentView === 'fasttrack') FastTrackView.render();
            },
            getRestartChapterStatus(chapterId) {
                const prog = this.getRestartProgress(chapterId);
                if (!prog) return 'not-started';
                if (prog.completed) return 'completed';
                if (prog.lecturesCompleted > 0 || prog.dppCompleted > 0) return 'in-progress';
                return 'not-started';
            },
            getRestartChapterDays(chapterId) {
                const prog = this.getRestartProgress(chapterId);
                if (!prog || !prog.startDate) return null;
                const start = new Date(prog.startDate);
                const end = prog.finishDate ? new Date(prog.finishDate) : new Date();
                return Math.max(1, Math.ceil((end - start) / (1000 * 60 * 60 * 24)));
            },
            save() { StorageManager.set('fastTrack', appState.fastTrack); },
            setActiveMode(mode) { appState.fastTrack.activeMode = mode;
                this.save(); if (ViewManager.currentView === 'fasttrack') FastTrackView.render(); },
            getActiveMode() { return appState.fastTrack.activeMode || null; },
            getOneShotAnalytics() {
                const allCh = FastTrackData.getAllOneShotChapters();
                const total = allCh.length;
                let completed = 0,
                    inProgress = 0,
                    notStarted = 0;
                let totalDays = 0;
                let fastest = null,
                    slowest = null;
                const withDays = [];
                for (const ch of allCh) {
                    const status = this.getOneShotChapterStatus(ch.id);
                    if (status === 'completed') completed++;
                    else if (status === 'in-progress') inProgress++;
                    else notStarted++;
                    const days = this.getOneShotChapterDays(ch.id);
                    if (days !== null && status === 'completed') { totalDays += days;
                        withDays.push({ id: ch.id, name: ch.name, days, recommended: ch.recommendedDays }); }
                }
                if (withDays.length > 0) { withDays.sort((a, b) => a.days - b.days);
                    fastest = withDays[0] || null;
                    slowest = withDays[withDays.length - 1] || null; }
                const avgDays = withDays.length > 0 ? Math.round((totalDays / withDays.length) * 10) / 10 : 0;
                const recommendedAvg = allCh.reduce((s, c) => s + c.recommendedDays, 0) / total;
                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                return { total, completed, inProgress, notStarted, progress, totalDays, avgDays, recommendedAvg: Math.round(
                        recommendedAvg * 10) / 10, fastest, slowest, remaining: total - completed - inProgress,
                    estimatedRemainingDays: Math.round((total - completed) * recommendedAvg) };
            },
            getRestartAnalytics() {
                const allCh = FastTrackData.getAllRestartChapters();
                const total = allCh.length;
                let completed = 0,
                    inProgress = 0,
                    notStarted = 0;
                let totalDays = 0;
                let fastest = null,
                    slowest = null;
                const withDays = [];
                for (const ch of allCh) {
                    const status = this.getRestartChapterStatus(ch.id);
                    if (status === 'completed') completed++;
                    else if (status === 'in-progress') inProgress++;
                    else notStarted++;
                    const days = this.getRestartChapterDays(ch.id);
                    if (days !== null && status === 'completed') { totalDays += days;
                        withDays.push({ id: ch.id, name: ch.name, days }); }
                }
                if (withDays.length > 0) { withDays.sort((a, b) => a.days - b.days);
                    fastest = withDays[0] || null;
                    slowest = withDays[withDays.length - 1] || null; }
                const avgDays = withDays.length > 0 ? Math.round((totalDays / withDays.length) * 10) / 10 : 0;
                const progress = total > 0 ? Math.round((completed / total) * 100) : 0;
                return { total, completed, inProgress, notStarted, progress, totalDays, avgDays, fastest, slowest,
                    remaining: total - completed - inProgress };
            },
            getTimeline(mode) {
                const timeline = [];
                if (mode === 'oneShot') {
                    const allCh = FastTrackData.getAllOneShotChapters();
                    for (const ch of allCh) {
                        const prog = this.getOneShotProgress(ch.id);
                        if (prog && prog.completed && prog.startDate && prog.finishDate) {
                            const days = this.getOneShotChapterDays(ch.id);
                            const rec = ch.recommendedDays;
                            const overTime = days !== null && days > rec;
                            timeline.push({ id: ch.id, name: ch.name, subject: ch.subject, category: ch.category || ch
                                    .subject, startDate: new Date(prog.startDate), finishDate: new Date(prog
                                    .finishDate), days: days || 0, recommended: rec, overTime: overTime,
                                status: 'completed' });
                        } else if (prog && prog.started && !prog.completed) {
                            timeline.push({ id: ch.id, name: ch.name, subject: ch.subject, category: ch.category || ch
                                    .subject, startDate: new Date(prog.startDate), finishDate: null, days: this
                                    .getOneShotChapterDays(ch.id) || 0, recommended: ch.recommendedDays,
                                overTime: false, status: 'in-progress' });
                        }
                    }
                } else {
                    const allCh = FastTrackData.getAllRestartChapters();
                    for (const ch of allCh) {
                        const prog = this.getRestartProgress(ch.id);
                        if (prog && prog.completed && prog.startDate && prog.finishDate) {
                            const days = this.getRestartChapterDays(ch.id);
                            timeline.push({ id: ch.id, name: ch.name, subject: ch.subject, category: ch.category || ch
                                    .subject, startDate: new Date(prog.startDate), finishDate: new Date(prog
                                    .finishDate), days: days || 0, recommended: 3, overTime: false,
                                status: 'completed' });
                        } else if (prog && (prog.lecturesCompleted > 0 || prog.dppCompleted > 0) && !prog.completed) {
                            timeline.push({ id: ch.id, name: ch.name, subject: ch.subject, category: ch.category || ch
                                    .subject, startDate: new Date(prog.startDate), finishDate: null, days: this
                                    .getRestartChapterDays(ch.id) || 0, recommended: 3, overTime: false,
                                status: 'in-progress' });
                        }
                    }
                }
                timeline.sort((a, b) => { if (!a.startDate) return 1; if (!b.startDate) return -1; return a.startDate - b
                        .startDate; });
                return timeline;
            }
        };

            addXP(amount, reason) {
                const userId = appState.currentUser?.id;

                const up = appState.userProgress[userId] || { subtopics: {}, chapterStatus: {}, xp: 0, level: 1,

                appState.xpTransactions.push({ userId, amount, reason, timestamp: new Date().toISOString() });

                if (newLevel > appState.levelCycle.level) {

                    ToastManager.show(`🔥 Level Up! You are now Level ${newLevel} — ${this.LEVELS[newLevel-1].name}`, 'xp');

            calculateLevel(xp) { let level = 1; for (let i = this.LEVELS.length - 1; i >= 0; i--) { if (xp >= this.LEVELS[i]
                        .threshold) { level = this.LEVELS[i].level; break; } } return level; },
            getLevelInfo(xp) {
                const level = this.calculateLevel(xp);
                const currentLevelData = this.LEVELS[level - 1];
                const nextLevelData = this.LEVELS[level] || null;
                const nextThreshold = nextLevelData ? nextLevelData.threshold : currentLevelData.threshold;
                const prevThreshold = currentLevelData.threshold;
                const progress = nextLevelData ? Math.min(1, (xp - prevThreshold) / (nextThreshold - prevThreshold)) : 1;
                return { level, name: currentLevelData.name, progress, xp, nextThreshold, prevThreshold };

                if (lastActive === todayStr) return;

                if (lastActive) {
                    const lastDate = this._parseDate(lastActive);
                    const diffDays = this._daysBetween(lastDate, today);
                    if (diffDays === 1) {
                        appState.streakData.currentStreak = (appState.streakData.currentStreak || 0) + 1;
                    } else if (diffDays > 1) {
                        appState.streakData.currentStreak = 1;
                    } else {
                        appState.streakData.currentStreak = 1;
                    }
                } else {
                    appState.streakData.currentStreak = 1;
                }

                appState.streakData.lastActive = todayStr;

                if (appState.streakData.currentStreak > (appState.streakData.longestStreak || 0)) {
                    appState.streakData.longestStreak = appState.streakData.currentStreak;
                }

                if (!appState.streakData.history) appState.streakData.history = [];
                appState.streakData.history.push({ date: todayStr, streak: appState.streakData.currentStreak });

                    XPManager.addXP(XPManager.XP_RULES.streakBonus, 'Weekly Streak Bonus');

            },

            _normalizeDate(date) {
                const y = date.getFullYear();
                const m = String(date.getMonth() + 1).padStart(2, '0');
                const d = String(date.getDate()).padStart(2, '0');
                return y + '-' + m + '-' + d;
            },

            _parseDate(str) {
                const parts = str.split('-').map(Number);
                return new Date(parts[0], parts[1] - 1, parts[2]);
            },

            _daysBetween(d1, d2) {
                const t1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate()).getTime();
                const t2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate()).getTime();
                return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));

        // ============================================================
        // VIEW MANAGER
        // ============================================================
        const ViewManager = {
            currentView: 'dashboard',
            switchView(viewName) {
                this.currentView = viewName;
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                const viewEl = document.getElementById(viewName + 'View');
                if (viewEl) viewEl.classList.add('active');
                const navBtn = document.querySelector(`.nav-item[data-view="${viewName}"]`);
                if (navBtn) navBtn.classList.add('active');
                const titles = {
                    dashboard: JEEFORGE_t('nav_dashboard'),
                    syllabus: JEEFORGE_t('nav_syllabus'),
                    advanced: JEEFORGE_t('nav_advanced'),
                    errorspace: JEEFORGE_t('nav_errorspace'),
                    tests: JEEFORGE_t('nav_tests'),
                    tracker: JEEFORGE_t('nav_tracker'),
                    analytics: JEEFORGE_t('nav_analytics'),
                    streaks: JEEFORGE_t('nav_streaks'),
                    profile: JEEFORGE_t('nav_profile'),
                    about: JEEFORGE_t('nav_about'),
                    settings: JEEFORGE_t('nav_settings'),
                    fasttrack: JEEFORGE_t('nav_fasttrack'),
                    testseries: JEEFORGE_t('nav_testseries'),
                    eventplanner: JEEFORGE_t('nav_eventplanner')
                };
                document.getElementById('viewTitle').textContent = titles[viewName] || 'JEEForge';
                if (window.innerWidth <= 1024) {
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('active');
                }

            renderView(viewName) {
                switch (viewName) {
                    case 'dashboard':
                        DashboardManager.updateDashboard();
                        break;
                    case 'syllabus':
                        SyllabusView.render();
                        break;
                    case 'advanced':
                        AdvancedView.render();
                        break;
                    case 'errorspace':
                        ErrorSpaceView.render();
                        break;
                    case 'tests':
                        TestsView.render();
                        break;
                    case 'tracker':
                        TrackerView.render();
                        break;
                    case 'analytics':
                        AnalyticsView.render();
                        break;
                    case 'streaks':
                        StreaksView.render();
                        break;
                    case 'profile':
                        ProfileView.render();
                        break;
                    case 'about':
                        AboutView.render();
                        break;
                    case 'settings':
                        SettingsView.render();
                        break;
                    case 'fasttrack':
                        FastTrackView.render();
                        break;
                    case 'testseries':
                        TestSeriesView.render();
                        break;

                        JFEVENT_View.render();
